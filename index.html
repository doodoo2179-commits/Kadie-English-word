    // Gemini requests are routed through a Vercel serverless function.
    function getVocabQuestAccessCode() {
      let code = sessionStorage.getItem('vq_access_code') || '';
      if (!code) {
        code = window.prompt('Enter the private VocabQuest access password:') || '';
        if (!code.trim()) throw new Error('VocabQuest access password is required.');
        sessionStorage.setItem('vq_access_code', code.trim());
      }
      return code.trim();
    }

    async function callVocabQuestAPI(payload) {
      let accessCode = getVocabQuestAccessCode();
      const send = (code) => fetch('/api/generate-question', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-vocabquest-access': code },
        body: JSON.stringify(payload)
      });
      let response = await send(accessCode);
      if (response.status === 401) {
        sessionStorage.removeItem('vq_access_code');
        accessCode = getVocabQuestAccessCode();
        response = await send(accessCode);
      }
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `Vercel API error (${response.status}).`);
      return data;
    }

    function shuffleArray(items) {
      const result = [...items];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    async function fetchAIQuestion(targetItem, allWords, previousSentences = []) {
      const data = await callVocabQuestAPI({
        task: 'question',
        target: targetItem,
        previousSentences: previousSentences.slice(-12)
      });
      const sentence = String(data.sentence || '').trim();
      const blankCount = (sentence.match(/_____/g) || []).length;
      if (!sentence || blankCount !== 1) throw new Error(`${targetItem.word}: 빈칸이 정확히 하나인 문장을 생성하지 못했습니다.`);
      if (sentence.toLowerCase().includes(targetItem.word.toLowerCase())) throw new Error(`${targetItem.word}: 정답 단어가 빈칸 밖에 노출되었습니다.`);
      if (previousSentences.some(old => old.trim().toLowerCase() === sentence.toLowerCase())) throw new Error(`${targetItem.word}: 문장이 중복되었습니다.`);
      const distractors = shuffleArray(allWords.filter(w => w.word.toLowerCase() !== targetItem.word.toLowerCase())).slice(0, 3).map(w => w.word);
      return {
        mode: 'single',
        targets: [targetItem],
        correctAnswer: targetItem.word,
        sentence,
        explanation: data.explanation || `The word “${targetItem.word}” fits the meaning and grammar of this sentence.`,
        options: shuffleArray([targetItem.word, ...distractors]),
        sourceType: data.sourceType || 'AI-created',
        sourceTitle: data.sourceTitle || 'Original AI-created sentence',
        sourceUrl: data.sourceUrl || ''
      };
    }

    // Helper: Guaranteed Audio Sound Generator using Web Audio API
    let globalAudioCtx = null;
    const playSoundEffect = (type) => {
      try {
        if (!globalAudioCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) globalAudioCtx = new AudioCtx();
        }
        if (globalAudioCtx && globalAudioCtx.state === 'suspended') {
          globalAudioCtx.resume();
        }
        if (!globalAudioCtx) return;

        const now = globalAudioCtx.currentTime;

        if (type === 'correct') {
          // Clear Crystal Bell Chime (F5 -> A5 -> C6)
          const freqs = [698.46, 880.00, 1046.50];
          freqs.forEach((f, idx) => {
            const osc = globalAudioCtx.createOscillator();
            const gain = globalAudioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, now + idx * 0.08);
            gain.gain.setValueAtTime(0.3, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.08 + 0.5);
            osc.connect(gain);
            gain.connect(globalAudioCtx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.5);
          });
        } else if (type === 'wrong') {
          // Harsh Low Buzzer Sound
          const osc = globalAudioCtx.createOscillator();
          const gain = globalAudioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.linearRampToValueAtTime(110, now + 0.35);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.connect(gain);
          gain.connect(globalAudioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.35);
        }
      } catch (e) {
        console.error("Sound error:", e);
      }
    };

    async function fetchMeaningForWord(wordText) {
      const data = await callVocabQuestAPI({ task: 'meaning', word: wordText });
      return data.meaning || 'A vocabulary word';
    }

    function App() {
      const [words, setWords] = useState(() => {
        const saved = localStorage.getItem("vocab_words_100");
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            // Merge defaults and saved unique words by word text
            const wordMap = new Map();
            DEFAULT_WORDS.forEach(w => wordMap.set(w.word.toLowerCase(), w));
            parsed.forEach(w => wordMap.set(w.word.toLowerCase(), w));
            return Array.from(wordMap.values()).sort((a, b) => a.word.localeCompare(b.word));
          } catch (e) {
            return DEFAULT_WORDS;
          }
        }
        return DEFAULT_WORDS;
      });

      const [user, setUser] = useState(null);
      const [isSyncing, setIsSyncing] = useState(true);

      const [score, setScore] = useState(0);
      const [highScore, setHighScore] = useState(() => {
        return parseInt(localStorage.getItem("vocab_high_score") || "0", 10);
      });

      const [quickWordInput, setQuickWordInput] = useState('');
      const [isAddingWord, setIsAddingWord] = useState(false);

      const [mode, setMode] = useState('home');
      const [selectedQuizMode, setSelectedQuizMode] = useState('single');

      const [quizQuestions, setQuizQuestions] = useState([]);
      const [currentIdx, setCurrentIdx] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [isCorrect, setIsCorrect] = useState(null);
      const [loadingProgress, setLoadingProgress] = useState(0);
      const [quizError, setQuizError] = useState('');

      const summaryRef = useRef(null);

      useEffect(() => {
        let unsubscribeSnapshot = null;
        let isMounted = true;

        async function initCloudSync() {
          try {
            if (!window.firebaseServices) return;
            const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore, doc, setDoc, onSnapshot } = window.firebaseServices;

            const appId = typeof __app_id !== 'undefined' ? __app_id : 'vocab-quiz-app';
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

            if (!firebaseConfig) {
              if (isMounted) setIsSyncing(false);
              return;
            }

            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            let currentUser = null;
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              const userCred = await signInWithCustomToken(auth, __initial_auth_token);
              currentUser = userCred.user;
            } else {
              const userCred = await signInAnonymously(auth);
              currentUser = userCred.user;
            }

            if (isMounted) setUser(currentUser);

            if (currentUser) {
              const vocabDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'vocab', 'wordList');

              unsubscribeSnapshot = onSnapshot(vocabDocRef, (snapshot) => {
                if (snapshot.exists() && snapshot.data()?.list) {
                  const cloudList = snapshot.data().list;
                  if (isMounted) {
                    // Always combine DEFAULT_WORDS with Cloud List to guarantee all added words are present everywhere
                    const wordMap = new Map();
                    DEFAULT_WORDS.forEach(w => wordMap.set(w.word.toLowerCase(), w));
                    cloudList.forEach(w => wordMap.set(w.word.toLowerCase(), w));
                    const merged = Array.from(wordMap.values()).sort((a, b) => a.word.localeCompare(b.word));

                    setWords(merged);
                    // Force-overwrite local cache with the newly updated merged cloud list
                    localStorage.setItem("vocab_words_100", JSON.stringify(merged));
                  }
                } else {
                  // If cloud list is empty, initialize it with DEFAULT_WORDS
                  setDoc(vocabDocRef, { list: DEFAULT_WORDS }).catch(console.error);
                }
                if (isMounted) setIsSyncing(false);
              }, (err) => {
                console.error("Firestore sync error:", err);
                if (isMounted) setIsSyncing(false);
              });
            }
          } catch (error) {
            console.error("Firebase init failed:", error);
            if (isMounted) setIsSyncing(false);
          }
        }

        initCloudSync();

        return () => {
          isMounted = false;
          if (unsubscribeSnapshot) unsubscribeSnapshot();
        };
      }, []);

      const updateWordList = async (newList) => {
        setWords(newList);
        localStorage.setItem("vocab_words_100", JSON.stringify(newList));

        try {
          if (window.firebaseServices && user) {
            const { getFirestore, doc, setDoc } = window.firebaseServices;
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'vocab-quiz-app';
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
            if (firebaseConfig) {
              const app = window.firebaseServices.initializeApp(firebaseConfig);
              const db = getFirestore(app);
              const vocabDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'vocab', 'wordList');
              await setDoc(vocabDocRef, { list: newList });
            }
          }
        } catch (err) {
          console.error("Cloud save failed, saved locally:", err);
        }
      };

      const handleAddQuickWord = async (e) => {
        e.preventDefault();
        const trimmed = quickWordInput.trim();
        if (!trimmed) return;

        // Check for existing duplicate word (case-insensitive)
        const isDuplicate = words.some(w => w.word.toLowerCase() === trimmed.toLowerCase());
        if (isDuplicate) {
          alert(`"The word '${trimmed}' is already in your Word Bank!"`);
          return;
        }

        setIsAddingWord(true);
        const autoMeaning = await fetchMeaningForWord(trimmed);

        const newEntry = {
          id: Date.now(),
          word: trimmed.charAt(0).toUpperCase() + trimmed.slice(1),
          meaning: autoMeaning
        };

        // Add and sort alphabetically (A-Z)
        const updatedList = [...words, newEntry].sort((a, b) => a.word.localeCompare(b.word));
        await updateWordList(updatedList);
        setQuickWordInput('');
        setIsAddingWord(false);
      };

      const handleDeleteWord = async (idToDelete, wordText, e) => {
        if (e) e.stopPropagation();
        if (window.confirm(`Delete "${wordText}" from your Word Bank?`)) {
          const updatedList = words.filter(w => w.id !== idToDelete);
          await updateWordList(updatedList);
        }
      };

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      const speak = (text, e) => {
        if (e) e.stopPropagation();
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'en-US';
          utterance.rate = 0.85;
          window.speechSynthesis.speak(utterance);
        }
      };

      const startQuiz = async () => {
        if (words.length < 10) {
          alert('A 10-question quiz needs at least 10 words in your Word Bank.');
          return;
        }

        setSelectedQuizMode('single');
        setMode('loading');
        setQuizError('');
        setLoadingProgress(0);

        try {
          getVocabQuestAccessCode(); // Prompt once before starting parallel requests.
        } catch (error) {
          setQuizError(error.message);
          setMode('error');
          return;
        }

        try {
          // Fisher-Yates shuffle selects 10 different words without replacement.
          const selectedWords = shuffleArray(words).slice(0, 10);
          const generated = [];
          const usedSentences = [];

          // Generate in small parallel batches to balance quality, speed and API rate limits.
          for (let i = 0; i < selectedWords.length; i += 5) {
            const batchWords = selectedWords.slice(i, i + 5);
            const batch = await Promise.all(batchWords.map(word =>
              fetchAIQuestion(word, words, usedSentences)
            ));

            for (const question of batch) {
              if (usedSentences.some(sentence => sentence.toLowerCase() === question.sentence.toLowerCase())) {
                // A duplicate is regenerated; it is never silently accepted.
                const target = question.targets[0];
                const replacement = await fetchAIQuestion(target, words, usedSentences);
                generated.push(replacement);
                usedSentences.push(replacement.sentence);
              } else {
                generated.push(question);
                usedSentences.push(question.sentence);
              }
            }
            setLoadingProgress(Math.round((generated.length / 10) * 100));
          }

          // Final integrity check: exactly ten questions, ten distinct answers and ten distinct sentences.
          const answerSet = new Set(generated.map(q => q.correctAnswer.toLowerCase()));
          const sentenceSet = new Set(generated.map(q => q.sentence.trim().toLowerCase()));
          if (generated.length !== 10 || answerSet.size !== 10 || sentenceSet.size !== 10) {
            throw new Error('10개의 서로 다른 문항을 검증하지 못했습니다. 다시 생성해 주세요.');
          }

          setQuizQuestions(generated);
          setCurrentIdx(0);
          setScore(0);
          setSelectedOption(null);
          setIsCorrect(null);
          setMode('quiz');
        } catch (error) {
          console.error('Quiz generation failed:', error);
          setQuizError(error.message || '문항을 생성하지 못했습니다. Vercel 환경변수와 서버 로그를 확인해 주세요.');
          setMode('error');
        }
      };

      const handleOptionSelect = (opt) => {
        if (selectedOption !== null) return;
        setSelectedOption(opt);
        const currentQ = quizQuestions[currentIdx];
        const isRight = opt === currentQ.correctAnswer;
        setIsCorrect(isRight);

        if (isRight) {
          playSoundEffect('correct');
          setScore(prev => {
            const nextScore = prev + 10;
            if (nextScore > highScore) {
              setHighScore(nextScore);
              localStorage.setItem("vocab_high_score", nextScore.toString());
            }
            return nextScore;
          });
          if (window.confetti) {
            window.confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
          }
        } else {
          playSoundEffect('wrong');
        }
      };

      const nextQuestion = () => {
        if (currentIdx + 1 < quizQuestions.length) {
          setCurrentIdx(prev => prev + 1);
          setSelectedOption(null);
          setIsCorrect(null);
        } else {
          setMode('summary');
        }
      };

      const downloadScreenshot = () => {
        if (summaryRef.current && window.html2canvas) {
          window.html2canvas(summaryRef.current).then(canvas => {
            const link = document.createElement('a');
            link.download = `VocabQuest_Score_${score}.png`;
            link.href = canvas.toDataURL();
            link.click();
          });
        }
      };

      // Alphabetically sorted words list helper
      const sortedWords = [...words].sort((a, b) => a.word.localeCompare(b.word));

      return (
        <div className="min-h-screen flex flex-col items-center p-4 sm:p-6 max-w-4xl mx-auto">
          {/* Header Bar */}
          <header className="w-full flex justify-between items-center bg-white/80 backdrop-blur-md rounded-2xl p-4 shadow-sm mb-6 border border-indigo-100">
            <div className="flex items-center gap-2 cursor-pointer" onClick={() => setMode('home')}>
              <div className="bg-indigo-600 text-white p-2 rounded-xl shadow-md">
                <i data-lucide="sparkles" className="w-6 h-6"></i>
              </div>
              <h1 className="text-2xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
                VocabQuest
              </h1>
            </div>

            <div className="flex items-center gap-3">
              <button 
                onClick={() => setMode('wordbank')}
                className="flex items-center gap-1.5 text-xs font-bold px-3 py-2 bg-purple-100 text-purple-800 rounded-xl hover:bg-purple-200 transition"
              >
                <i data-lucide="book-open" className="w-4 h-4"></i>
                <span className="hidden sm:inline">📖 Word Bank ({words.length})</span>
              </button>
              <button
                onClick={() => { sessionStorage.removeItem('vq_access_code'); alert('Private access session cleared.'); }}
                className="flex items-center gap-1.5 text-xs font-bold px-3 py-2 bg-amber-100 text-amber-800 rounded-xl hover:bg-amber-200 transition"
              >
                <i data-lucide="lock" className="w-4 h-4"></i>
                <span className="hidden sm:inline">🔒 Private Access</span>
              </button>
              <div className="flex items-center gap-1.5 bg-indigo-50 px-3 py-1.5 rounded-xl text-indigo-700 font-bold text-sm">
                <i data-lucide="trophy" className="w-4 h-4 text-amber-500"></i>
                <span>Best: {highScore}</span>
              </div>
            </div>
          </header>

          {/* HOME VIEW */}
          {mode === 'home' && (
            <main className="w-full space-y-6 animate-pop">
              {/* Hero Banner */}
              <div className="bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 rounded-3xl p-6 sm:p-8 text-white shadow-xl relative overflow-hidden">
                <div className="relative z-10 max-w-lg">
                  <span className="inline-block px-3 py-1 bg-white/20 rounded-full text-xs font-extrabold uppercase tracking-wider mb-3">
                    AI Vocabulary Booster
                  </span>
                  <h2 className="text-3xl sm:text-4xl font-extrabold leading-tight mb-3">
                    Master Vocabulary with Fun AI Stories!
                  </h2>
                  <p className="text-indigo-100 text-sm sm:text-base mb-6">
                    Every session selects 10 different words and generates fresh, source-aware fill-in-the-blank questions.
                  </p>
                  
                  <div className="flex flex-wrap gap-3">
                    <button 
                      onClick={() => startQuiz()}
                      className="px-6 py-3 bg-white text-indigo-600 font-extrabold rounded-2xl shadow-lg hover:bg-indigo-50 transition transform active:scale-95 flex items-center gap-2"
                    >
                      <i data-lucide="play" className="fill-current"></i> Start 10-Word Quiz
                    </button>
                  </div>
                </div>
              </div>

              {/* Quick Word Adder */}
              <div className="bg-white rounded-3xl p-6 shadow-sm border border-indigo-50">
                <h3 className="text-lg font-bold text-slate-800 mb-3 flex items-center gap-2">
                  <i data-lucide="plus-circle" className="text-indigo-600"></i> Add New Vocabulary
                </h3>
                <form onSubmit={handleAddQuickWord} className="flex gap-2">
                  <input
                    type="text"
                    value={quickWordInput}
                    onChange={(e) => setQuickWordInput(e.target.value)}
                    placeholder="Enter word (AI will auto-generate meaning & sort A-Z)..."
                    className="flex-1 p-3 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm"
                    disabled={isAddingWord}
                  />
                  <button
                    type="submit"
                    disabled={isAddingWord}
                    className="px-5 py-3 bg-indigo-600 text-white font-bold rounded-2xl hover:bg-indigo-700 transition disabled:opacity-50 flex items-center gap-2"
                  >
                    {isAddingWord ? <i data-lucide="loader" className="animate-spin"></i> : <i data-lucide="plus"></i>}
                    <span>Add Word</span>
                  </button>
                </form>
              </div>

              {/* Navigation Card to Full Word Bank */}
              <div className="bg-gradient-to-r from-purple-50 to-indigo-50 rounded-3xl p-6 border border-purple-100 flex justify-between items-center shadow-sm">
                <div>
                  <h3 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="book-open" className="text-purple-600"></i> Word Bank Directory
                  </h3>
                  <p className="text-sm text-slate-500 mt-1">
                    Currently managing <strong className="text-indigo-600">{words.length} vocabulary words</strong> sorted alphabetically (A-Z).
                  </p>
                </div>
                <button
                  onClick={() => setMode('wordbank')}
                  className="px-5 py-3 bg-purple-600 text-white font-bold rounded-2xl shadow-md hover:bg-purple-700 transition flex items-center gap-2"
                >
                  <span>View All Words</span>
                  <i data-lucide="arrow-right" className="w-4 h-4"></i>
                </button>
              </div>
            </main>
          )}

          {/* FULL WORD BANK VIEW */}
          {mode === 'wordbank' && (
            <main className="w-full space-y-6 animate-pop">
              <div className="flex justify-between items-center bg-white rounded-3xl p-6 border border-indigo-50 shadow-sm">
                <div>
                  <h2 className="text-2xl font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="book-open" className="text-purple-600"></i> All Vocabulary Words ({sortedWords.length})
                  </h2>
                  <p className="text-xs text-slate-500 mt-1">Automatically sorted in alphabetical order (A to Z)</p>
                </div>
                <button
                  onClick={() => setMode('home')}
                  className="px-4 py-2 bg-slate-100 text-slate-700 font-bold rounded-xl hover:bg-slate-200 transition text-sm flex items-center gap-1.5"
                >
                  <i data-lucide="home" className="w-4 h-4"></i> Back to Home
                </button>
              </div>

              <div className="bg-white rounded-3xl p-6 shadow-sm border border-indigo-50">
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                  {sortedWords.map((w) => (
                    <div key={w.id} className="p-4 bg-slate-50 border border-slate-100 rounded-2xl flex justify-between items-center hover:border-indigo-200 transition">
                      <div className="pr-2 flex-1">
                        <span className="font-extrabold text-slate-800 text-base">{w.word}</span>
                        <p className="text-xs text-slate-500 mt-0.5">{w.meaning}</p>
                      </div>
                      <div className="flex items-center gap-1">
                        <button onClick={(e) => speak(w.word, e)} title="Listen" className="p-2 text-slate-400 hover:text-indigo-600 bg-white rounded-xl shadow-xs border border-slate-100 transition">
                          <i data-lucide="volume-2" className="w-4 h-4"></i>
                        </button>
                        <button onClick={(e) => handleDeleteWord(w.id, w.word, e)} title="Delete word" className="p-2 text-rose-400 hover:text-rose-600 bg-white rounded-xl shadow-xs border border-slate-100 transition">
                          <i data-lucide="trash-2" className="w-4 h-4"></i>
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </main>
          )}

          {/* LOADING VIEW */}
          {mode === 'loading' && (
            <main className="w-full flex flex-col items-center justify-center p-12 bg-white rounded-3xl border border-indigo-50 shadow-sm animate-pop">
              <div className="w-16 h-16 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mb-6"></div>
              <h2 className="text-2xl font-bold text-slate-800 mb-2">Generating AI Quiz...</h2>
              <p className="text-sm text-slate-500 mb-6">Searching for real-world contexts and creating 10 brand-new questions. This may take up to a minute.</p>
              <div className="w-full max-w-md bg-slate-100 h-3 rounded-full overflow-hidden">
                <div className="bg-indigo-600 h-full transition-all duration-300" style={{ width: `${loadingProgress}%` }}></div>
              </div>
              <span className="text-xs font-bold text-indigo-600 mt-2">{loadingProgress}% Complete</span>
            </main>
          )}

          {/* QUIZ GENERATION ERROR */}
          {mode === 'error' && (
            <main className="w-full bg-white rounded-3xl border border-rose-100 shadow-sm p-8 text-center animate-pop">
              <div className="text-rose-500 text-4xl mb-3">!</div>
              <h2 className="text-2xl font-bold text-slate-800 mb-3">Could not build the quiz</h2>
              <p className="text-sm text-slate-600 mb-6">{quizError}</p>
              <div className="flex flex-wrap justify-center gap-3">
                <button onClick={() => startQuiz()} className="px-6 py-3 bg-indigo-600 text-white font-bold rounded-2xl">Try Again</button>
                <button onClick={() => setMode('home')} className="px-6 py-3 bg-slate-100 text-slate-700 font-bold rounded-2xl">Home</button>
              </div>
            </main>
          )}

          {/* QUIZ VIEW */}
          {mode === 'quiz' && quizQuestions.length > 0 && (
            <main className="w-full space-y-6 animate-pop">
              {/* Question Card */}
              <div className="bg-white rounded-3xl p-6 sm:p-8 border border-indigo-50 shadow-sm space-y-6">
                <div className="flex justify-between items-center text-sm text-slate-400 font-bold">
                  <span>Question {currentIdx + 1} of 10</span>
                  <span className="text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">Score: {score}</span>
                </div>

                <div className="p-6 bg-indigo-50/50 border border-indigo-100 rounded-2xl text-slate-800 text-lg sm:text-xl font-medium leading-relaxed">
                  {quizQuestions[currentIdx].sentence.replace('_____', '________')}
                </div>
                <div className="text-xs text-slate-500 -mt-3">
                  {quizQuestions[currentIdx].sourceType === 'web-inspired' && quizQuestions[currentIdx].sourceUrl ? (
                    <span>Inspired by: <a href={quizQuestions[currentIdx].sourceUrl} target="_blank" rel="noopener noreferrer" className="text-indigo-600 underline">{quizQuestions[currentIdx].sourceTitle}</a></span>
                  ) : (
                    <span>Original AI-created sentence</span>
                  )}
                </div>

                {/* Options List without invalid nested buttons */}
                <div className="grid grid-cols-1 gap-3">
                  {quizQuestions[currentIdx].options.map((opt, i) => {
                    let btnStyle = "bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100";
                    if (selectedOption !== null) {
                      if (opt === quizQuestions[currentIdx].correctAnswer) {
                        btnStyle = "bg-emerald-50 border-emerald-500 text-emerald-800 font-bold";
                      } else if (opt === selectedOption) {
                        btnStyle = "bg-rose-50 border-rose-400 text-rose-800";
                      }
                    }

                    return (
                      <div
                        key={i}
                        role="button"
                        tabIndex={0}
                        onClick={() => handleOptionSelect(opt)}
                        onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') handleOptionSelect(opt); }}
                        className={`p-4 rounded-2xl border-2 transition cursor-pointer flex justify-between items-center ${btnStyle}`}
                      >
                        <span className="font-semibold text-base">{opt}</span>
                        <button
                          type="button"
                          onClick={(e) => speak(opt, e)}
                          className="p-2 text-slate-400 hover:text-indigo-600 transition"
                          title="Pronounce"
                        >
                          <i data-lucide="volume-2" className="w-5 h-5"></i>
                        </button>
                      </div>
                    );
                  })}
                </div>

                {/* Feedback / Next Button */}
                {selectedOption !== null && (
                  <div className="pt-4 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-4 animate-pop">
                    <div className="flex items-center gap-2">
                      {isCorrect ? (
                        <span className="text-emerald-600 font-extrabold flex items-center gap-1.5">
                          <i data-lucide="check-circle-2"></i> Correct!
                        </span>
                      ) : (
                        <span className="text-rose-600 font-extrabold flex items-center gap-1.5">
                          <i data-lucide="x-circle"></i> Incorrect
                        </span>
                      )}
                      <p className="text-xs text-slate-500 ml-2">{quizQuestions[currentIdx].explanation}</p>
                    </div>

                    <button
                      onClick={nextQuestion}
                      className="w-full sm:w-auto px-6 py-3 bg-indigo-600 text-white font-extrabold rounded-2xl shadow-md hover:bg-indigo-700 transition flex items-center justify-center gap-2"
                    >
                      <span>{currentIdx + 1 === quizQuestions.length ? "See Results" : "Next Question"}</span>
                      <i data-lucide="arrow-right"></i>
                    </button>
                  </div>
                )}
              </div>
            </main>
          )}

          {/* SUMMARY VIEW */}
          {mode === 'summary' && (
            <main className="w-full space-y-6 animate-pop">
              <div ref={summaryRef} className="bg-white rounded-3xl p-8 border border-indigo-50 shadow-sm text-center space-y-6">
                <div className="inline-flex p-4 rounded-full bg-indigo-50 text-indigo-600 mb-2">
                  <i data-lucide="award" className="w-12 h-12"></i>
                </div>

                {score >= 80 ? (
                  <div>
                    <span className="inline-block px-4 py-1.5 bg-emerald-100 text-emerald-800 text-xs font-black rounded-full uppercase tracking-wider mb-2">
                      🎉 PASS!
                    </span>
                    <h2 className="text-3xl font-extrabold text-slate-800">Outstanding Job!</h2>
                    <p className="text-sm text-slate-500 mt-1">You solved the quiz with flying colors!</p>
                  </div>
                ) : (
                  <div>
                    <span className="inline-block px-4 py-1.5 bg-amber-100 text-amber-800 text-xs font-black rounded-full uppercase tracking-wider mb-2">
                      💪 NOT BAD! TRY AGAIN
                    </span>
                    <h2 className="text-3xl font-extrabold text-slate-800">Keep Practicing!</h2>
                    <p className="text-sm text-slate-500 mt-1">Score 80 or higher to PASS next time!</p>
                  </div>
                )}

                <div className="py-6 border-y border-slate-100 flex justify-center gap-8">
                  <div>
                    <span className="text-xs text-slate-400 font-bold block uppercase">Final Score</span>
                    <span className="text-4xl font-black text-indigo-600">{score} / 100</span>
                  </div>
                  <div>
                    <span className="text-xs text-slate-400 font-bold block uppercase">High Score</span>
                    <span className="text-4xl font-black text-amber-500">{highScore}</span>
                  </div>
                </div>

                <div className="flex flex-wrap justify-center gap-3 pt-2">
                  <button
                    onClick={() => startQuiz()}
                    className="px-6 py-3 bg-indigo-600 text-white font-extrabold rounded-2xl shadow-md hover:bg-indigo-700 transition flex items-center gap-2"
                  >
                    <i data-lucide="rotate-ccw"></i> Play Again
                  </button>
                  <button
                    onClick={downloadScreenshot}
                    className="px-6 py-3 bg-slate-100 text-slate-700 font-extrabold rounded-2xl hover:bg-slate-200 transition flex items-center gap-2"
                  >
                    <i data-lucide="download"></i> Save Result Card
                  </button>
                  <button
                    onClick={() => setMode('home')}
                    className="px-6 py-3 bg-purple-100 text-purple-700 font-extrabold rounded-2xl hover:bg-purple-200 transition flex items-center gap-2"
                  >
                    <i data-lucide="home"></i> Home
                  </button>
                </div>
              </div>
            </main>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
