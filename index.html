    // Web Audio Synthesizer for Chime sound & Applause/Fireworks sound
    function playChimeSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);
          gain.gain.setValueAtTime(0.3, now + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.35);
        });
      } catch (e) {}
    }

    function playVictorySound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        
        // Fanfare melody
        const melody = [523.25, 523.25, 523.25, 659.25, 783.99, 1046.50];
        const times = [0, 0.12, 0.24, 0.36, 0.54, 0.78];
        const durations = [0.1, 0.1, 0.1, 0.15, 0.2, 0.6];

        melody.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + times[i]);
          gain.gain.setValueAtTime(0.4, now + times[i]);
          gain.gain.exponentialRampToValueAtTime(0.001, now + times[i] + durations[i]);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + times[i]);
          osc.stop(now + times[i] + durations[i] + 0.05);
        });
      } catch (e) {}
    }

    function App() {
      const [view, setView] = useState('home'); // 'home' | 'quiz' | 'bank' | 'result'
      const [quizMode, setQuizMode] = useState('single'); // 'single' (1 correct) | 'double' (2 correct out of 5)
      const [wordList, setWordList] = useState([]);
      const [history, setHistory] = useState([]);
      const [quizQuestions, setQuizQuestions] = useState([]);
      const [quizIndex, setQuizIndex] = useState(0);
      const [score, setScore] = useState(0);
      
      // Quiz State
      const [selectedOptions, setSelectedOptions] = useState([]); // Array for multi select
      const [isAnswered, setIsAnswered] = useState(false);
      const [userAnswers, setUserAnswers] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        try {
          const savedWords = localStorage.getItem('vocab_words');
          let currentList = DEFAULT_WORDS;

          if (savedWords) {
            const parsed = JSON.parse(savedWords);
            if (Array.isArray(parsed) && parsed.length > 0) {
              const combined = [...DEFAULT_WORDS];
              parsed.forEach(item => {
                if (!combined.some(w => w.word.toLowerCase() === item.word.toLowerCase())) {
                  combined.push(item);
                }
              });
              currentList = combined;
            }
          }

          currentList.sort((a, b) => a.word.localeCompare(b.word));
          setWordList(currentList);
        } catch (e) {
          console.error("Storage load error:", e);
          setWordList(DEFAULT_WORDS);
        } finally {
          setLoading(false);
        }
      }, []);

      const handleAddWord = (inputStr) => {
        if (!inputStr.trim()) return 0;
        const tokens = inputStr.split(/[\n,\s]+/).map(t => t.trim()).filter(Boolean);
        if (tokens.length === 0) return 0;

        let addedCount = 0;
        let newList = [...wordList];

        tokens.forEach(rawToken => {
          const cleanWord = rawToken.charAt(0).toUpperCase() + rawToken.slice(1).toLowerCase();
          const exists = newList.some(w => w.word.toLowerCase() === cleanWord.toLowerCase());

          if (!exists) {
            newList.push({
              id: Date.now() + Math.random(),
              word: cleanWord,
              meaning: "custom vocabulary entry"
            });
            addedCount++;
          }
        });

        if (addedCount > 0) {
          newList.sort((a, b) => a.word.localeCompare(b.word));
          setWordList(newList);
          try {
            localStorage.setItem('vocab_words', JSON.stringify(newList));
          } catch(e){}
        }
        return addedCount;
      };

      const handleDeleteWord = (targetWord, id) => {
        const updated = wordList.filter(w => w.id !== id && w.word !== targetWord);
        setWordList(updated);
        try {
          localStorage.setItem('vocab_words', JSON.stringify(updated));
        } catch(e){}
      };

      const startQuiz = (mode) => {
        if (wordList.length < 5) return;
        setQuizMode(mode);

        let available = wordList.filter(w => !history.includes(w.word));
        if (available.length < 10) {
          available = [...wordList];
          setHistory([]);
        }

        const shuffled = [...available].sort(() => 0.5 - Math.random());
        const selected = shuffled.slice(0, 10);

        setHistory(prev => [...prev, ...selected.map(s => s.word)].slice(-40));

        const generated = selected.map((targetItem) => {
          if (mode === 'single') {
            const distractors = wordList
              .filter(w => w.word !== targetItem.word)
              .sort(() => 0.5 - Math.random())
              .slice(0, 3)
              .map(w => w.word);

            const options = [targetItem.word, ...distractors].sort(() => 0.5 - Math.random());
            return {
              target: targetItem,
              sentence: `Choose the word that means "${targetItem.meaning}":`,
              options: options,
              correctAnswers: [targetItem.word]
            };
          } else {
            // Mode: 2 correct answers out of 5 options
            // Find another word with similar context or pick 2 correct target items
            const secondCorrectItem = wordList
              .filter(w => w.word !== targetItem.word)
              .sort(() => 0.5 - Math.random())[0];

            const distractors = wordList
              .filter(w => w.word !== targetItem.word && w.word !== secondCorrectItem.word)
              .sort(() => 0.5 - Math.random())
              .slice(0, 3)
              .map(w => w.word);

            const options = [targetItem.word, secondCorrectItem.word, ...distractors].sort(() => 0.5 - Math.random());
            return {
              target: targetItem,
              sentence: `Select BOTH words (${targetItem.word} & ${secondCorrectItem.word}) to match this dual challenge!`,
              options: options,
              correctAnswers: [targetItem.word, secondCorrectItem.word]
            };
          }
        });

        setQuizQuestions(generated);
        setQuizIndex(0);
        setScore(0);
        setSelectedOptions([]);
        setIsAnswered(false);
        setUserAnswers([]);
        setView('quiz');
      };

      const handleOptionClick = (opt) => {
        if (isAnswered) return;

        if (quizMode === 'single') {
          setSelectedOptions([opt]);
          setIsAnswered(true);

          const currentQ = quizQuestions[quizIndex];
          const isCorrect = currentQ.correctAnswers.includes(opt);
          if (isCorrect) {
            setScore(s => s + 1);
            playChimeSound();
          }

          setUserAnswers(prev => [...prev, {
            question: currentQ.sentence,
            correct: currentQ.correctAnswers.join(', '),
            userChoice: opt,
            isCorrect: isCorrect
          }]);
        } else {
          // Double choice mode: allow selecting up to 2
          let updated = [];
          if (selectedOptions.includes(opt)) {
            updated = selectedOptions.filter(o => o !== opt);
          } else {
            if (selectedOptions.length < 2) {
              updated = [...selectedOptions, opt];
            } else {
              updated = [selectedOptions[1], opt];
            }
          }
          setSelectedOptions(updated);
        }
      };

      const submitDoubleAnswer = () => {
        if (selectedOptions.length !== 2 || isAnswered) return;
        setIsAnswered(true);

        const currentQ = quizQuestions[quizIndex];
        const isCorrect = currentQ.correctAnswers.every(ans => selectedOptions.includes(ans));

        if (isCorrect) {
          setScore(s => s + 1);
          playChimeSound();
        }

        setUserAnswers(prev => [...prev, {
          question: currentQ.sentence,
          correct: currentQ.correctAnswers.join(' & '),
          userChoice: selectedOptions.join(' & '),
          isCorrect: isCorrect
        }]);
      };

      const nextQuestion = () => {
        if (quizIndex + 1 < quizQuestions.length) {
          setQuizIndex(i => i + 1);
          setSelectedOptions([]);
          setIsAnswered(false);
        } else {
          setView('result');
          playVictorySound();
          if (window.confetti) {
            window.confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });
          }
        }
      };

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [view, quizIndex, isAnswered, selectedOptions]);

      if (loading) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-50">
            <div className="text-center font-bold text-indigo-600 text-lg">Loading VocabQuest...</div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col justify-between">
          {/* Main Top Header */}
          <header className="bg-white/80 backdrop-blur-md border-b border-indigo-100 px-6 py-4 flex justify-between items-center shadow-sm sticky top-0 z-50">
            <div className="flex items-center gap-2 cursor-pointer" onClick={() => setView('home')}>
              <span className="text-3xl">🎓</span>
              <span className="text-2xl font-extrabold text-indigo-900 font-fun tracking-wide">VocabQuest</span>
            </div>
            <div className="flex items-center gap-3">
              <button
                onClick={() => setView('bank')}
                className="flex items-center gap-2 px-4 py-2 bg-indigo-50 text-indigo-700 font-bold rounded-xl hover:bg-indigo-100 transition text-sm border border-indigo-200"
              >
                <i data-lucide="book-open" className="w-4 h-4"></i>
                Word Bank ({wordList.length})
              </button>
            </div>
          </header>

          <main className="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col justify-center">
            {/* 1. HOME SCREEN - Beautiful Card Selection UI */}
            {view === 'home' && (
              <div className="text-center py-10 px-6 bg-white/90 rounded-3xl shadow-2xl border border-indigo-100 animate-pop">
                <span className="text-7xl mb-4 inline-block animate-bounce">🚀</span>
                <h1 className="text-4xl font-extrabold text-indigo-950 font-fun mb-2">VocabQuest Challenge!</h1>
                <p className="text-slate-600 max-w-md mx-auto mb-8 text-base font-medium">
                  Select your preferred quiz mode below or manage your Vocabulary Bank!
                </p>

                {/* 3 Main Mode Selection Cards */}
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-5 max-w-3xl mx-auto">
                  {/* Mode 1 */}
                  <div
                    onClick={() => startQuiz('single')}
                    className="p-6 bg-gradient-to-b from-indigo-500 to-indigo-600 hover:from-indigo-600 hover:to-indigo-700 text-white rounded-2xl shadow-lg cursor-pointer transform hover:-translate-y-1 transition flex flex-col justify-between"
                  >
                    <div>
                      <div className="text-4xl mb-3">🎯</div>
                      <h3 className="text-xl font-bold font-fun mb-1">1. Single Answer</h3>
                      <p className="text-xs text-indigo-100">Standard 4-choice quiz. Pick 1 correct answer.</p>
                    </div>
                    <span className="mt-4 py-2 bg-white/20 rounded-xl text-xs font-bold uppercase tracking-wider">Start 1-Choice</span>
                  </div>

                  {/* Mode 2 */}
                  <div
                    onClick={() => startQuiz('double')}
                    className="p-6 bg-gradient-to-b from-purple-500 to-purple-600 hover:from-purple-600 hover:to-purple-700 text-white rounded-2xl shadow-lg cursor-pointer transform hover:-translate-y-1 transition flex flex-col justify-between"
                  >
                    <div>
                      <div className="text-4xl mb-3">✌️</div>
                      <h3 className="text-xl font-bold font-fun mb-1">2. Pick 2 Answers</h3>
                      <p className="text-xs text-purple-100">Advanced 5-choice quiz. Pick 2 correct answers!</p>
                    </div>
                    <span className="mt-4 py-2 bg-white/20 rounded-xl text-xs font-bold uppercase tracking-wider">Start 2-Choice</span>
                  </div>

                  {/* Mode 3 */}
                  <div
                    onClick={() => setView('bank')}
                    className="p-6 bg-gradient-to-b from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 text-white rounded-2xl shadow-lg cursor-pointer transform hover:-translate-y-1 transition flex flex-col justify-between"
                  >
                    <div>
                      <div className="text-4xl mb-3">📖</div>
                      <h3 className="text-xl font-bold font-fun mb-1">3. Word Directory</h3>
                      <p className="text-xs text-emerald-100">View all words & add new vocabulary list.</p>
                    </div>
                    <span className="mt-4 py-2 bg-white/20 rounded-xl text-xs font-bold uppercase tracking-wider">Manage Words ({wordList.length})</span>
                  </div>
                </div>
              </div>
            )}

            {/* 2. WORD BANK & ADD WORDS SCREEN */}
            {view === 'bank' && (
              <WordBankView
                wordList={wordList}
                onAddWord={handleAddWord}
                onDeleteWord={handleDeleteWord}
                onBack={() => setView('home')}
              />
            )}

            {/* 3. QUIZ SCREEN */}
            {view === 'quiz' && quizQuestions.length > 0 && (
              <div className="bg-white rounded-3xl p-6 md:p-8 shadow-xl border border-indigo-100 animate-pop">
                <div className="flex justify-between items-center mb-6">
                  <span className="text-xs font-extrabold text-indigo-600 uppercase tracking-widest bg-indigo-50 px-3 py-1.5 rounded-lg border border-indigo-100">
                    Question {quizIndex + 1} of 10 ({quizMode === 'single' ? 'Single Choice' : 'Select 2 Options'})
                  </span>
                  <span className="text-sm font-bold text-slate-500">
                    Score: <strong className="text-indigo-600">{score}</strong>
                  </span>
                </div>

                <div className="bg-indigo-50/50 p-6 rounded-2xl border-2 border-indigo-100 mb-8">
                  <p className="text-xl md:text-2xl font-bold text-slate-800 leading-relaxed">
                    {quizQuestions[quizIndex].sentence}
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                  {quizQuestions[quizIndex].options.map((option, idx) => {
                    const isSelected = selectedOptions.includes(option);
                    let btnStyle = "bg-white border-2 border-slate-200 text-slate-800 hover:border-indigo-400";

                    if (isSelected) {
                      btnStyle = "bg-indigo-50 border-2 border-indigo-500 text-indigo-900 font-bold shadow-sm";
                    }

                    if (isAnswered) {
                      const isTargetCorrect = quizQuestions[quizIndex].correctAnswers.includes(option);
                      if (isTargetCorrect) {
                        btnStyle = "bg-emerald-50 border-2 border-emerald-500 text-emerald-900 font-extrabold";
                      } else if (isSelected) {
                        btnStyle = "bg-rose-50 border-2 border-rose-500 text-rose-900 font-bold";
                      } else {
                        btnStyle = "bg-slate-50 border-2 border-slate-100 text-slate-400 opacity-50";
                      }
                    }

                    return (
                      <button
                        key={idx}
                        onClick={() => handleOptionClick(option)}
                        disabled={isAnswered}
                        className={`p-4 rounded-xl text-lg font-bold transition flex items-center justify-between text-left ${btnStyle}`}
                      >
                        <span>{option}</span>
                        {isSelected && !isAnswered && <span className="text-xs font-bold text-indigo-600 bg-indigo-100 px-2 py-1 rounded">Selected</span>}
                        {isAnswered && quizQuestions[quizIndex].correctAnswers.includes(option) && (
                          <span className="text-emerald-600 font-bold">✓ Correct</span>
                        )}
                      </button>
                    );
                  })}
                </div>

                {/* Double Mode Confirm Button */}
                {quizMode === 'double' && !isAnswered && (
                  <div className="flex justify-center mb-4">
                    <button
                      onClick={submitDoubleAnswer}
                      disabled={selectedOptions.length !== 2}
                      className={`px-8 py-3 rounded-xl font-bold text-white shadow-md transition ${selectedOptions.length === 2 ? 'bg-purple-600 hover:bg-purple-700' : 'bg-slate-300 cursor-not-allowed'}`}
                    >
                      Submit 2 Answers ({selectedOptions.length}/2)
                    </button>
                  </div>
                )}

                {isAnswered && (
                  <div className="flex justify-end">
                    <button
                      onClick={nextQuestion}
                      className="px-8 py-3 bg-indigo-600 text-white font-bold text-lg rounded-xl shadow-lg hover:bg-indigo-700 transition flex items-center gap-2"
                    >
                      {quizIndex + 1 === quizQuestions.length ? 'See Final Results' : 'Next Question'}
                      <i data-lucide="arrow-right" className="w-5 h-5"></i>
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* 4. RESULT SUMMARY SCREEN */}
            {view === 'result' && (
              <div className="bg-white rounded-3xl p-8 shadow-xl border border-indigo-100 text-center animate-pop">
                <span className="text-6xl mb-4 inline-block">🎉</span>
                <h2 className="text-3xl font-extrabold text-indigo-950 font-fun mb-2">Quiz Completed!</h2>
                <p className="text-slate-600 mb-6 text-lg">
                  You scored <strong className="text-indigo-600 font-extrabold text-2xl">{score}</strong> out of <strong>10</strong>
                </p>

                <div className="text-left bg-slate-50 rounded-2xl p-4 mb-8 max-h-72 overflow-y-auto space-y-3 border border-slate-200">
                  {userAnswers.map((ans, i) => (
                    <div key={i} className="p-3 bg-white rounded-xl shadow-sm border border-slate-100 flex justify-between items-center text-sm">
                      <div>
                        <p className="font-semibold text-slate-800 mb-1">{ans.question}</p>
                        <p className="text-xs text-slate-500">
                          Your choice: <span className={ans.isCorrect ? "text-emerald-600 font-bold" : "text-rose-600 font-bold"}>{ans.userChoice}</span>
                          {!ans.isCorrect && ` (Correct: ${ans.correct})`}
                        </p>
                      </div>
                      <span className={ans.isCorrect ? "text-emerald-500 font-bold text-lg" : "text-rose-500 font-bold text-lg"}>
                        {ans.isCorrect ? "✓" : "✕"}
                      </span>
                    </div>
                  ))}
                </div>

                <div className="flex justify-center gap-4">
                  <button
                    onClick={() => startQuiz(quizMode)}
                    className="px-6 py-3 bg-indigo-600 text-white font-bold rounded-xl shadow-md hover:bg-indigo-700 transition"
                  >
                    Play Again
                  </button>
                  <button
                    onClick={() => setView('home')}
                    className="px-6 py-3 bg-slate-100 text-slate-700 font-bold rounded-xl hover:bg-slate-200 transition"
                  >
                    Back to Main Screen
                  </button>
                </div>
              </div>
            )}
          </main>

          <footer className="text-center py-4 text-xs text-slate-400 border-t border-slate-100 bg-white/80">
            VocabQuest © 2026 • AI-Powered Learning for Kids
          </footer>
        </div>
      );
    }

    // Component for Word Bank & Bulk Add Words Screen
    function WordBankView({ wordList, onAddWord, onDeleteWord, onBack }) {
      const [inputWord, setInputWord] = useState('');
      const [message, setMessage] = useState('');

      const wordCounts = {};
      wordList.forEach(item => {
        const lower = item.word.toLowerCase();
        wordCounts[lower] = (wordCounts[lower] || 0) + 1;
      });

      const handleAdd = (e) => {
        e.preventDefault();
        if (!inputWord.trim()) return;

        const count = onAddWord(inputWord);
        if (count > 0) {
          setMessage(`✨ ${count} new word(s) added & sorted!`);
        } else {
          setMessage(`ℹ️ Word(s) already exist. Duplicates auto-filtered.`);
        }
        setInputWord('');
        setTimeout(() => setMessage(''), 4000);
      };

      return (
        <div className="max-w-4xl mx-auto px-4 py-8 animate-pop">
          <div className="flex items-center justify-between mb-6">
            <button
              onClick={onBack}
              className="flex items-center gap-2 px-4 py-2 bg-white rounded-xl shadow-sm text-indigo-600 font-bold hover:bg-indigo-50 transition border border-indigo-100"
            >
              <i data-lucide="arrow-left" className="w-4 h-4"></i> Back to Main Screen
            </button>
            <h1 className="text-2xl md:text-3xl font-extrabold text-indigo-900 font-fun">
              📖 Word Bank Directory ({wordList.length})
            </h1>
          </div>

          {/* Add Word Box */}
          <div className="bg-white rounded-2xl p-6 shadow-md border-2 border-indigo-100 mb-8">
            <h2 className="text-xl font-bold text-slate-800 mb-1 font-fun">➕ Add New Vocabulary</h2>
            <p className="text-xs text-slate-500 mb-4">
              Enter single or multiple words separated by <strong>commas, spaces, or lines</strong>. Duplicates are filtered automatically.
            </p>
            <form onSubmit={handleAdd} className="flex flex-col sm:flex-row gap-3">
              <input
                type="text"
                placeholder="e.g. Confessed, Commanded, Devour..."
                value={inputWord}
                onChange={(e) => setInputWord(e.target.value)}
                className="flex-1 px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-indigo-500 focus:outline-none text-slate-800 font-semibold text-sm"
              />
              <button
                type="submit"
                className="px-6 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-bold rounded-xl shadow-md hover:opacity-90 transition whitespace-nowrap text-sm"
              >
                + Add Words
              </button>
            </form>
            {message && (
              <p className="mt-3 text-sm font-bold text-indigo-600 bg-indigo-50 p-2.5 rounded-lg border border-indigo-100 animate-pop">
                {message}
              </p>
            )}
          </div>

          {/* Word List Cards */}
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {wordList.map((item) => {
              const isDuplicate = wordCounts[item.word.toLowerCase()] > 1;
              const cardBg = isDuplicate 
                ? "bg-orange-50 border-2 border-orange-400 text-orange-950" 
                : "bg-white border border-slate-100";

              return (
                <div key={item.id} className={`${cardBg} p-4 rounded-xl shadow-sm flex justify-between items-center hover:shadow-md transition`}>
                  <div>
                    <div className="flex items-center gap-2">
                      <h3 className={`text-lg font-bold ${isDuplicate ? 'text-orange-900' : 'text-indigo-900'}`}>
                        {item.word}
                      </h3>
                      {isDuplicate && (
                        <span className="text-[10px] font-extrabold uppercase px-2 py-0.5 bg-orange-200 text-orange-800 rounded-md">
                          Duplicate
                        </span>
                      )}
                    </div>
                    <p className="text-xs text-slate-500">{item.meaning || 'vocabulary word'}</p>
                  </div>
                  <div className="flex items-center gap-1">
                    <button
                      onClick={() => {
                        const utterance = new SpeechSynthesisUtterance(item.word);
                        utterance.lang = 'en-US';
                        window.speechSynthesis.speak(utterance);
                      }}
                      className="p-2 text-slate-400 hover:text-indigo-600 rounded-lg hover:bg-slate-50 transition"
                      title="Pronounce Word"
                    >
                      <i data-lucide="volume-2" className="w-5 h-5"></i>
                    </button>
                    <button
                      onClick={() => {
                        if (confirm(`Delete "${item.word}" from your Word Bank?`)) {
                          onDeleteWord(item.word, item.id);
                        }
                      }}
                      className="p-2 text-slate-400 hover:text-red-500 rounded-lg hover:bg-red-50 transition"
                      title="Delete Word"
                    >
                      <i data-lucide="trash-2" className="w-5 h-5"></i>
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
