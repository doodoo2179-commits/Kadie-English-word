    // Helper: Gemini API Generator (Single & Double Blanks)
    async function fetchAIQuestion(targetItems, allWords, quizMode, userApiKey = '') {
      // Prioritize explicit hardcoded key -> then localStorage -> fallback key
      const apiKey = "AQ.Ab8RN6IwykbkZIt6Rtl2yGY5Ft_71EEHvArU498dQGuey7ggjQ" || userApiKey || localStorage.getItem("gemini_user_api_key");
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

      const storyThemes = [
        "space mission", "detective mystery", "magical fantasy", "underwater adventure",
        "superhero combat", "time travel", "jungle safari", "cyberpunk heist", "haunted castle", "pirate quest",
        "dinosaur island", "secret agent infiltration"
      ];
      const randomTheme = storyThemes[Math.floor(Math.random() * storyThemes.length)];

      if (quizMode === 'double') {
        const word1 = targetItems[0];
        const word2 = targetItems[1];

        const prompt = `Create a unique, creative fill-in-the-blank sentence with a theme of "${randomTheme}" for a 12-year-old kid with TWO blanks: (____1____) and (____2____).
Target Word 1: "${word1.word}" (${word1.meaning})
Target Word 2: "${word2.word}" (${word2.meaning})

Respond strictly in valid JSON format:
{
  "sentence": "The story sentence using (____1____) for word 1 and (____2____) for word 2.",
  "explanation": "Brief 1-sentence kid-friendly explanation of why both words fit."
}`;

        try {
          const payload = {
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { responseMimeType: "application/json" }
          };
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await response.json();
          const jsonText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
          const parsed = JSON.parse(jsonText);

          const correctAnswerStr = `${word1.word} & ${word2.word}`;

          const optionsSet = new Set([correctAnswerStr]);
          while (optionsSet.size < 5) {
            const r1 = allWords[Math.floor(Math.random() * allWords.length)].word;
            const r2 = allWords[Math.floor(Math.random() * allWords.length)].word;
            if (r1 !== r2 && `${r1} & ${r2}` !== correctAnswerStr) {
              optionsSet.add(`${r1} & ${r2}`);
            }
          }

          const options = Array.from(optionsSet).sort(() => 0.5 - Math.random());

          return {
            mode: 'double',
            targets: [word1, word2],
            correctAnswer: correctAnswerStr,
            sentence: parsed.sentence || `During the ${randomTheme}, the team discovered a (____1____) clue inside the (____2____).`,
            explanation: parsed.explanation || `"${word1.word}" and "${word2.word}" are the exact words that complete this mystery!`,
            options: options
          };
        } catch (err) {
          const correctAnswerStr = `${word1.word} & ${word2.word}`;
          const optionsSet = new Set([correctAnswerStr]);
          while (optionsSet.size < 5) {
            const r1 = allWords[Math.floor(Math.random() * allWords.length)].word;
            const r2 = allWords[Math.floor(Math.random() * allWords.length)].word;
            if (r1 !== r2) optionsSet.add(`${r1} & ${r2}`);
          }
          return {
            mode: 'double',
            targets: [word1, word2],
            correctAnswer: correctAnswerStr,
            sentence: `In the middle of a ${randomTheme}, the team found a (____1____) object inside the (____2____).`,
            explanation: `"${word1.word}" (${word1.meaning}) and "${word2.word}" (${word2.meaning}) fit here.`,
            options: Array.from(optionsSet).sort(() => 0.5 - Math.random())
          };
        }
      } else {
        const targetItem = targetItems[0];
        const distractors = allWords
          .filter(w => w.word !== targetItem.word)
          .sort(() => 0.5 - Math.random())
          .slice(0, 3)
          .map(w => w.word);

        const prompt = `Create a unique fill-in-the-blank sentence with a theme of "${randomTheme}" for a 12-year-old kid.
Target Word: "${targetItem.word}" (Meaning: ${targetItem.meaning}).

Respond strictly in valid JSON format:
{
  "sentence": "Sentence with (_____) replacing the target word.",
  "explanation": "Brief kid-friendly explanation why this word fits."
}`;

        try {
          const payload = {
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { responseMimeType: "application/json" }
          };
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await response.json();
          const jsonText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
          const parsed = JSON.parse(jsonText);
          const options = [...distractors, targetItem.word].sort(() => 0.5 - Math.random());

          return {
            mode: 'single',
            targets: [targetItem],
            correctAnswer: targetItem.word,
            sentence: parsed.sentence || `During a ${randomTheme}, the hero encountered a very (_____) situation.`,
            explanation: parsed.explanation || `"${targetItem.word}" fits this context!`,
            options: options
          };
        } catch (err) {
          const options = [...distractors, targetItem.word].sort(() => 0.5 - Math.random());
          return {
            mode: 'single',
            targets: [targetItem],
            correctAnswer: targetItem.word,
            sentence: `In this ${randomTheme}, everyone was surprised by the (_____) event.`,
            explanation: `"${targetItem.word}" means: ${targetItem.meaning}.`,
            options: options
          };
        }
      }
    }

    // Helper: AI Auto Meaning Lookup
    async function fetchMeaningForWord(wordText, userApiKey = '') {
      const apiKey = "AQ.Ab8RN6IwykbkZIt6Rtl2yGY5Ft_71EEHvArU498dQGuey7ggjQ" || userApiKey || localStorage.getItem("gemini_user_api_key");
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

      const prompt = `Provide a simple, concise 12-year-old kid friendly English meaning/definition for the vocabulary word "${wordText}".
Respond strictly in valid JSON format:
{
  "meaning": "simple definition here"
}`;

      try {
        const payload = {
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { responseMimeType: "application/json" }
        };
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        const jsonText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
        const parsed = JSON.parse(jsonText);
        return parsed.meaning || "a vocabulary word";
      } catch (err) {
        return "a vocabulary word";
      }
    }

    function App() {
      const [words, setWords] = useState(() => {
        const saved = localStorage.getItem("vocab_words_100");
        return saved ? JSON.parse(saved) : DEFAULT_WORDS;
      });

      const [apiKeyInput, setApiKeyInput] = useState(() => {
        return localStorage.getItem("gemini_user_api_key") || "";
      });
      const [showApiKeyModal, setShowApiKeyModal] = useState(false);

      const [user, setUser] = useState(null);
      const [isSyncing, setIsSyncing] = useState(true);

      const [score, setScore] = useState(0);
      const [highScore, setHighScore] = useState(() => {
        return parseInt(localStorage.getItem("vocab_high_score") || "0", 10);
      });

      const [quickWordInput, setQuickWordInput] = useState('');
      const [isAddingWord, setIsAddingWord] = useState(false);

      const [mode, setMode] = useState('home');
      const [selectedQuizMode, setSelectedQuizMode] = useState('single');

      const [quizQuestions, setQuizQuestions] = useState([]);
      const [currentIdx, setCurrentIdx] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [isCorrect, setIsCorrect] = useState(null);
      const [loadingProgress, setLoadingProgress] = useState(0);

      const summaryRef = useRef(null);

      useEffect(() => {
        let unsubscribeSnapshot = null;
        let isMounted = true;

        async function initCloudSync() {
          try {
            if (!window.firebaseServices) return;
            const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore, doc, setDoc, onSnapshot } = window.firebaseServices;

            const appId = typeof __app_id !== 'undefined' ? __app_id : 'vocab-quiz-app';
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

            if (!firebaseConfig) {
              if (isMounted) setIsSyncing(false);
              return;
            }

            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            let currentUser = null;
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              const userCred = await signInWithCustomToken(auth, __initial_auth_token);
              currentUser = userCred.user;
            } else {
              const userCred = await signInAnonymously(auth);
              currentUser = userCred.user;
            }

            if (isMounted) setUser(currentUser);

            if (currentUser) {
              const vocabDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'vocab', 'wordList');

              unsubscribeSnapshot = onSnapshot(vocabDocRef, (snapshot) => {
                if (snapshot.exists() && snapshot.data()?.list) {
                  const cloudList = snapshot.data().list;
                  if (isMounted) {
                    setWords(cloudList);
                    localStorage.setItem("vocab_words_100", JSON.stringify(cloudList));
                  }
                } else {
                  setDoc(vocabDocRef, { list: DEFAULT_WORDS }).catch(console.error);
                }
                if (isMounted) setIsSyncing(false);
              }, (err) => {
                console.error("Firestore sync error:", err);
                if (isMounted) setIsSyncing(false);
              });
            }
          } catch (error) {
            console.error("Firebase init failed:", error);
            if (isMounted) setIsSyncing(false);
          }
        }

        initCloudSync();

        return () => {
          isMounted = false;
          if (unsubscribeSnapshot) unsubscribeSnapshot();
        };
      }, []);

      const updateWordList = async (newList) => {
        setWords(newList);
        localStorage.setItem("vocab_words_100", JSON.stringify(newList));

        try {
          if (window.firebaseServices && user) {
            const { getFirestore, doc, setDoc } = window.firebaseServices;
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'vocab-quiz-app';
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
            if (firebaseConfig) {
              const app = window.firebaseServices.initializeApp(firebaseConfig);
              const db = getFirestore(app);
              const vocabDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'vocab', 'wordList');
              await setDoc(vocabDocRef, { list: newList });
            }
          }
        } catch (err) {
          console.error("Cloud save failed, saved locally:", err);
        }
      };

      const handleAddQuickWord = async (e) => {
        e.preventDefault();
        const trimmed = quickWordInput.trim();
        if (!trimmed) return;

        setIsAddingWord(true);
        const autoMeaning = await fetchMeaningForWord(trimmed);

        const newEntry = {
          id: Date.now(),
          word: trimmed,
          meaning: autoMeaning
        };

        await updateWordList([newEntry, ...words]);
        setQuickWordInput('');
        setIsAddingWord(false);
      };

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      const speak = (text, e) => {
        if (e) e.stopPropagation();
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'en-US';
          utterance.rate = 0.85;
          window.speechSynthesis.speak(utterance);
        }
      };

      const startQuiz = async (quizType = 'single') => {
        if (words.length < 5) {
          alert("Please add at least 5 words to start the quiz!");
          return;
        }

        setSelectedQuizMode(quizType);
        setMode('loading');
        setLoadingProgress(0);

        const currentApiKey = localStorage.getItem("gemini_user_api_key") || "AQ.Ab8RN6IwykbkZIt6Rtl2yGY5Ft_71EEHvArU498dQGuey7ggjQ";

        // Shuffle words pool uniquely for all 10 questions to ensure no repeated target words
        const pool = [...words].sort(() => 0.5 - Math.random());

        const questionsArr = [];
        for (let i = 0; i < 10; i++) {
          if (quizType === 'double') {
            const idx1 = (i * 2) % pool.length;
            const idx2 = (i * 2 + 1) % pool.length;
            const targets = [pool[idx1], pool[idx2]];
            const q = await fetchAIQuestion(targets, words, 'double', currentApiKey);
            questionsArr.push(q);
          } else {
            const idx = i % pool.length;
            const targets = [pool[idx]];
            const q = await fetchAIQuestion(targets, words, 'single', currentApiKey);
            questionsArr.push(q);
          }
          setLoadingProgress(Math.round(((i + 1) / 10) * 100));
        }

        setQuizQuestions(questionsArr);
        setCurrentIdx(0);
        setScore(0);
        setSelectedOption(null);
        setIsCorrect(null);
        setMode('quiz');
      };

      const handleOptionSelect = (opt) => {
        if (selectedOption !== null) return;
        setSelectedOption(opt);
        const currentQ = quizQuestions[currentIdx];
        const isRight = opt === currentQ.correctAnswer;
        setIsCorrect(isRight);

        if (isRight) {
          setScore(prev => {
            const nextScore = prev + 10;
            if (nextScore > highScore) {
              setHighScore(nextScore);
              localStorage.setItem("vocab_high_score", nextScore.toString());
            }
            return nextScore;
          });
          if (window.confetti) {
            window.confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
          }
        }
      };

      const nextQuestion = () => {
        if (currentIdx + 1 < quizQuestions.length) {
          setCurrentIdx(prev => prev + 1);
          setSelectedOption(null);
          setIsCorrect(null);
        } else {
          setMode('summary');
        }
      };

      const saveApiKey = () => {
        localStorage.setItem("gemini_user_api_key", apiKeyInput.trim());
        setShowApiKeyModal(false);
      };

      const downloadScreenshot = () => {
        if (summaryRef.current && window.html2canvas) {
          window.html2canvas(summaryRef.current).then(canvas => {
            const link = document.createElement('a');
            link.download = `VocabQuest_Score_${score}.png`;
            link.href = canvas.toDataURL();
            link.click();
          });
        }
      };

      return (
        <div className="min-h-screen flex flex-col items-center p-4 sm:p-6 max-w-4xl mx-auto">
          {/* Header Bar */}
          <header className="w-full flex justify-between items-center bg-white/80 backdrop-blur-md rounded-2xl p-4 shadow-sm mb-6 border border-indigo-100">
            <div className="flex items-center gap-2 cursor-pointer" onClick={() => setMode('home')}>
              <div className="bg-indigo-600 text-white p-2 rounded-xl shadow-md">
                <i data-lucide="sparkles" className="w-6 h-6"></i>
              </div>
              <h1 className="text-2xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
                VocabQuest
              </h1>
            </div>

            <div className="flex items-center gap-3">
              <button 
                onClick={() => setShowApiKeyModal(true)}
                className="flex items-center gap-1.5 text-xs font-bold px-3 py-2 bg-amber-100 text-amber-800 rounded-xl hover:bg-amber-200 transition"
              >
                <i data-lucide="key" className="w-4 h-4"></i>
                <span className="hidden sm:inline">🔑 API Key</span>
              </button>
              <div className="flex items-center gap-1.5 bg-indigo-50 px-3 py-1.5 rounded-xl text-indigo-700 font-bold text-sm">
                <i data-lucide="trophy" className="w-4 h-4 text-amber-500"></i>
                <span>Best: {highScore}</span>
              </div>
            </div>
          </header>

          {/* API Key Modal */}
          {showApiKeyModal && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 w-full max-w-md shadow-2xl animate-pop border border-slate-100">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="key" className="text-amber-500"></i> Gemini API Key
                  </h3>
                  <button onClick={() => setShowApiKeyModal(false)} className="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x"></i>
                  </button>
                </div>
                <p className="text-sm text-slate-600 mb-4">
                  Enter your free Google Gemini API Key. It will be stored locally on your device for generating AI quiz questions.
                </p>
                <input
                  type="password"
                  value={apiKeyInput}
                  onChange={(e) => setApiKeyInput(e.target.value)}
                  placeholder="Paste your Gemini API key here..."
                  className="w-full p-3 border border-slate-200 rounded-xl mb-4 focus:ring-2 focus:ring-indigo-500 outline-none"
                />
                <div className="flex justify-end gap-2">
                  <button onClick={() => setShowApiKeyModal(false)} className="px-4 py-2 text-slate-600 font-bold">Cancel</button>
                  <button onClick={saveApiKey} className="px-5 py-2 bg-indigo-600 text-white font-bold rounded-xl shadow-md hover:bg-indigo-700">Save Key</button>
                </div>
              </div>
            </div>
          )}

          {/* HOME VIEW */}
          {mode === 'home' && (
            <main className="w-full space-y-6 animate-pop">
              {/* Hero Banner */}
              <div className="bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 rounded-3xl p-6 sm:p-8 text-white shadow-xl relative overflow-hidden">
                <div className="relative z-10 max-w-lg">
                  <span className="inline-block px-3 py-1 bg-white/20 rounded-full text-xs font-extrabold uppercase tracking-wider mb-3">
                    AI Vocabulary Booster
                  </span>
                  <h2 className="text-3xl sm:text-4xl font-extrabold leading-tight mb-3">
                    Master 100 Words with Fun AI Stories!
                  </h2>
                  <p className="text-indigo-100 text-sm sm:text-base mb-6">
                    Solve fill-in-the-blank mysteries generated dynamically by AI for target words.
                  </p>
                  
                  <div className="flex flex-wrap gap-3">
                    <button 
                      onClick={() => startQuiz('single')}
                      className="px-6 py-3 bg-white text-indigo-600 font-extrabold rounded-2xl shadow-lg hover:bg-indigo-50 transition transform active:scale-95 flex items-center gap-2"
                    >
                      <i data-lucide="play" className="fill-current"></i> Single Blank Quiz
                    </button>
                    <button 
                      onClick={() => startQuiz('double')}
                      className="px-6 py-3 bg-indigo-900/40 border border-white/30 text-white font-extrabold rounded-2xl hover:bg-indigo-900/60 transition transform active:scale-95 flex items-center gap-2"
                    >
                      <i data-lucide="layers"></i> Double Blank Quiz
                    </button>
                  </div>
                </div>
              </div>

              {/* Quick Word Adder */}
              <div className="bg-white rounded-3xl p-6 shadow-sm border border-indigo-50">
                <h3 className="text-lg font-bold text-slate-800 mb-3 flex items-center gap-2">
                  <i data-lucide="plus-circle" className="text-indigo-600"></i> Add New Vocabulary
                </h3>
                <form onSubmit={handleAddQuickWord} className="flex gap-2">
                  <input
                    type="text"
                    value={quickWordInput}
                    onChange={(e) => setQuickWordInput(e.target.value)}
                    placeholder="Enter word (AI will auto-generate meaning)..."
                    className="flex-1 p-3 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm"
                    disabled={isAddingWord}
                  />
                  <button
                    type="submit"
                    disabled={isAddingWord}
                    className="px-5 py-3 bg-indigo-600 text-white font-bold rounded-2xl hover:bg-indigo-700 transition disabled:opacity-50 flex items-center gap-2"
                  >
                    {isAddingWord ? <i data-lucide="loader" className="animate-spin"></i> : <i data-lucide="plus"></i>}
                    <span>Add</span>
                  </button>
                </form>
              </div>

              {/* Words Overview */}
              <div className="bg-white rounded-3xl p-6 shadow-sm border border-indigo-50">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="book-open" className="text-purple-600"></i> Word Bank ({words.length})
                  </h3>
                </div>
                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 max-h-60 overflow-y-auto p-1">
                  {words.slice(0, 24).map((w) => (
                    <div key={w.id} className="p-3 bg-slate-50 border border-slate-100 rounded-2xl flex flex-col justify-between group hover:border-indigo-200 transition">
                      <div className="flex justify-between items-start">
                        <span className="font-bold text-slate-800 text-sm">{w.word}</span>
                        <button onClick={(e) => speak(w.word, e)} className="text-slate-400 hover:text-indigo-600">
                          <i data-lucide="volume-2" className="w-4 h-4"></i>
                        </button>
                      </div>
                      <span className="text-xs text-slate-500 line-clamp-1 mt-1">{w.meaning}</span>
                    </div>
                  ))}
                </div>
              </div>
            </main>
          )}

          {/* LOADING VIEW */}
          {mode === 'loading' && (
            <main className="w-full py-16 flex flex-col items-center justify-center text-center animate-pop">
              <div className="w-20 h-20 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mb-6"></div>
              <h2 className="text-2xl font-bold text-slate-800 mb-2">Generating AI Stories...</h2>
              <p className="text-slate-500 mb-6 max-w-sm">Crafting unique context questions for target words.</p>
              <div className="w-64 bg-slate-200 rounded-full h-3 overflow-hidden">
                <div className="bg-indigo-600 h-full transition-all duration-300" style={{ width: `${loadingProgress}%` }}></div>
              </div>
              <span className="text-xs font-bold text-slate-500 mt-2">{loadingProgress}%</span>
            </main>
          )}

          {/* QUIZ VIEW */}
          {mode === 'quiz' && quizQuestions.length > 0 && (
            <main className="w-full max-w-2xl space-y-6 animate-pop">
              {/* Progress Bar & Counter */}
              <div className="flex justify-between items-center text-sm font-bold text-slate-500">
                <span>Question {currentIdx + 1} of {quizQuestions.length}</span>
                <span className="text-indigo-600">Score: {score}</span>
              </div>
              <div className="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                <div 
                  className="bg-indigo-600 h-full transition-all duration-300" 
                  style={{ width: `${((currentIdx + 1) / quizQuestions.length) * 100}%` }}
                ></div>
              </div>

              {/* Question Card */}
              <div className="bg-white rounded-3xl p-6 sm:p-8 shadow-md border border-indigo-50 relative">
                <div className="mb-6">
                  <span className="inline-block px-3 py-1 bg-purple-100 text-purple-700 rounded-full text-xs font-bold uppercase mb-3">
                    {quizQuestions[currentIdx].mode === 'double' ? 'Double Blank Mystery' : 'Single Blank Context'}
                  </span>
                  <h3 className="text-xl sm:text-2xl font-bold text-slate-800 leading-relaxed">
                    {quizQuestions[currentIdx].sentence}
                  </h3>
                </div>

                {/* Options */}
                <div className="space-y-3">
                  {quizQuestions[currentIdx].options.map((opt, i) => {
                    let btnStyle = "bg-slate-50 border-slate-200 text-slate-700 hover:border-indigo-300";
                    if (selectedOption !== null) {
                      if (opt === quizQuestions[currentIdx].correctAnswer) {
                        btnStyle = "bg-emerald-500 border-emerald-500 text-white shadow-md";
                      } else if (opt === selectedOption) {
                        btnStyle = "bg-rose-500 border-rose-500 text-white shadow-md";
                      } else {
                        btnStyle = "bg-slate-50 border-slate-100 text-slate-400 opacity-60";
                      }
                    }

                    return (
                      <button
                        key={i}
                        onClick={() => handleOptionSelect(opt)}
                        disabled={selectedOption !== null}
                        className={`w-full p-4 rounded-2xl border-2 font-bold text-left text-base sm:text-lg transition flex justify-between items-center ${btnStyle}`}
                      >
                        <span>{opt}</span>
                        <div className="flex items-center gap-2">
                          <button 
                            onClick={(e) => speak(opt, e)} 
                            className="p-1.5 rounded-xl bg-black/5 hover:bg-black/10 transition"
                          >
                            <i data-lucide="volume-2" className="w-4 h-4"></i>
                          </button>
                        </div>
                      </button>
                    );
                  })}
                </div>

                {/* Answer Feedback & Explanation */}
                {selectedOption !== null && (
                  <div className={`mt-6 p-4 rounded-2xl ${isCorrect ? 'bg-emerald-50 text-emerald-900 border border-emerald-200' : 'bg-rose-50 text-rose-900 border border-rose-200'} animate-pop`}>
                    <div className="flex items-center gap-2 font-bold mb-1">
                      <i data-lucide={isCorrect ? "check-circle-2" : "alert-circle"} className={isCorrect ? "text-emerald-600" : "text-rose-600"}></i>
                      <span>{isCorrect ? "Awesome! That's correct!" : "Not quite right!"}</span>
                    </div>
                    <p className="text-sm mt-1">{quizQuestions[currentIdx].explanation}</p>
                    
                    {!isCorrect && (
                      <div className="mt-3 text-xs border-t border-rose-200/60 pt-2 text-rose-700">
                        <strong>Chosen Word Meaning:</strong> {
                          words.find(w => w.word === selectedOption)?.meaning || "Selected word does not fit the target contextual requirement."
                        }
                      </div>
                    )}
                  </div>
                )}
              </div>

              {/* Next Button */}
              {selectedOption !== null && (
                <button
                  onClick={nextQuestion}
                  className="w-full py-4 bg-indigo-600 text-white font-extrabold rounded-2xl shadow-lg hover:bg-indigo-700 transition flex justify-center items-center gap-2 text-lg animate-pop"
                >
                  <span>{currentIdx + 1 === quizQuestions.length ? "Finish Quiz" : "Next Question"}</span>
                  <i data-lucide="arrow-right"></i>
                </button>
              )}
            </main>
          )}

          {/* SUMMARY VIEW */}
          {mode === 'summary' && (
            <main className="w-full max-w-lg animate-pop space-y-6">
              <div ref={summaryRef} className="bg-white rounded-3xl p-8 shadow-xl border border-indigo-50 text-center relative overflow-hidden">
                <div className="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner">
                  <i data-lucide="award" className="w-10 h-10"></i>
                </div>

                <h2 className="text-3xl font-extrabold text-slate-800 mb-1">Quiz Completed!</h2>
                <p className="text-slate-500 text-sm mb-6">Great job training your vocabulary today!</p>

                <div className="bg-gradient-to-r from-indigo-50 to-purple-50 p-6 rounded-2xl border border-indigo-100 mb-6">
                  <span className="text-xs font-bold uppercase tracking-wider text-indigo-500">Your Final Score</span>
                  <div className="text-5xl font-black text-indigo-600 my-1">{score}</div>
                  <span className="text-xs text-slate-500">Out of {quizQuestions.length * 10} Points</span>
                </div>

                <div className="flex gap-3">
                  <button
                    onClick={() => startQuiz(selectedQuizMode)}
                    className="flex-1 py-3 bg-indigo-600 text-white font-bold rounded-2xl shadow-md hover:bg-indigo-700 transition"
                  >
                    Play Again
                  </button>
                  <button
                    onClick={downloadScreenshot}
                    className="px-4 py-3 bg-slate-100 text-slate-700 font-bold rounded-2xl hover:bg-slate-200 transition flex items-center gap-2"
                  >
                    <i data-lucide="camera" className="w-4 h-4"></i>
                    <span>Save Result</span>
                  </button>
                </div>
              </div>

              <button
                onClick={() => setMode('home')}
                className="w-full py-3 bg-white text-slate-600 font-bold rounded-2xl border border-slate-200 hover:bg-slate-50 transition"
              >
                Back to Home
              </button>
            </main>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
