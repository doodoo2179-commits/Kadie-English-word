<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VocabQuest - AI English Quiz for Kids</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
    }
    .font-fun {
      font-family: 'Fredoka', cursive;
    }
    @keyframes pop {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: pop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Full 125 Vocabulary List (A-Z Sorted)
    const DEFAULT_WORDS = [
      { id: 1, word: "Absurd", meaning: "wildly unreasonable or ridiculous" },
      { id: 2, word: "Accomplices", meaning: "partners in a crime or secret plan" },
      { id: 3, word: "Admitted", meaning: "confessed or acknowledged as true" },
      { id: 4, word: "Adversary", meaning: "an opponent or enemy in a contest or fight" },
      { id: 5, word: "Affable", meaning: "friendly, good-natured, or easy to talk to" },
      { id: 6, word: "Ambushed", meaning: "attacked unexpectedly from a hidden position" },
      { id: 7, word: "Amicably", meaning: "in a friendly and peaceable manner" },
      { id: 8, word: "Asinine", meaning: "extremely foolish or stupid" },
      { id: 9, word: "Barmy", meaning: "mad or crazy" },
      { id: 10, word: "Begged", meaning: "asked desperately or earnestly" },
      { id: 11, word: "Befriended", meaning: "acted as a friend to someone" },
      { id: 12, word: "Beseeched", meaning: "begged or implored urgently" },
      { id: 13, word: "Bloodshed", meaning: "the killing or wounding of people" },
      { id: 14, word: "Bragged", meaning: "boasted or talked with excessive pride" },
      { id: 15, word: "Butchery", meaning: "brutal or indiscriminate slaughter" },
      { id: 16, word: "Cadavers", meaning: "dead bodies intended for medical study" },
      { id: 17, word: "Camaraderie", meaning: "mutual trust and friendship among peers" },
      { id: 18, word: "Carcass", meaning: "the dead body of an animal" },
      { id: 19, word: "Carnage", meaning: "the killing of a large number of people" },
      { id: 20, word: "Carrion", meaning: "decaying flesh of dead animals" },
      { id: 21, word: "Combatants", meaning: "persons or groups engaged in a fight or war" },
      { id: 22, word: "Commanded", meaning: "gave an authoritative order" },
      { id: 23, word: "Confessed", meaning: "admitted to having committed a crime or fault" },
      { id: 24, word: "Cordial", meaning: "warm and friendly" },
      { id: 25, word: "Corpse", meaning: "a dead body, especially of a human being" },
      { id: 26, word: "Crony", meaning: "a close friend or companion" },
      { id: 27, word: "Deduction", meaning: "the process of reaching a conclusion by reasoning" },
      { id: 28, word: "Devour", meaning: "eat hungrily or quickly" },
      { id: 29, word: "Dogfight", meaning: "a close aerial combat between military aircraft" },
      { id: 30, word: "Erroneous", meaning: "wrong or incorrect" },
      { id: 31, word: "Essence", meaning: "the intrinsic nature or indispensable quality of something" },
      { id: 32, word: "Exclaimed", meaning: "cried out suddenly in surprise or emotion" },
      { id: 33, word: "Exhausted", meaning: "extremely tired or depleted" },
      { id: 34, word: "Far-fetched", meaning: "unlikely and unconvincing" },
      { id: 35, word: "Farcical", meaning: "absurd and ridiculous" },
      { id: 36, word: "Feral", meaning: "wild and untamed" },
      { id: 37, word: "Foolhardy", meaning: "recklessly bold or rash" },
      { id: 38, word: "Foray", meaning: "a sudden attack or brief excursion" },
      { id: 39, word: "Forensics", meaning: "scientific tests or techniques used in crime investigation" },
      { id: 40, word: "Fray", meaning: "a situation of intense activity or conflict" },
      { id: 41, word: "Frivolous", meaning: "not having any serious purpose or value" },
      { id: 42, word: "Gangsters", meaning: "members of an organized gang of criminals" },
      { id: 43, word: "Genial", meaning: "friendly and cheerful" },
      { id: 44, word: "Gimmick", meaning: "a trick or device intended to attract attention" },
      { id: 45, word: "Grumbled", meaning: "complained in a low, mumbling voice" },
      { id: 46, word: "Hare-brained", meaning: "foolish and impractical" },
      { id: 47, word: "Idiotic", meaning: "very stupid or foolish" },
      { id: 48, word: "Implications", meaning: "consequences or effects that may happen" },
      { id: 49, word: "Inane", meaning: "silly or senseless" },
      { id: 50, word: "Informant", meaning: "a person who gives secret information to police" },
      { id: 51, word: "Inseparable", meaning: "unable to be separated or parted" },
      { id: 52, word: "Instructed", meaning: "directed or ordered someone to do something" },
      { id: 53, word: "Intelligence", meaning: "secret information collected about an enemy or crime" },
      { id: 54, word: "Interrogated", meaning: "questioned closely or aggressively" },
      { id: 55, word: "Interrupted", meaning: "stopped a continuous action or speech" },
      { id: 56, word: "Investigator", meaning: "a person who carries out a formal inquiry" },
      { id: 57, word: "Irrational", meaning: "not logical or reasonable" },
      { id: 58, word: "Irresponsible", meaning: "not showing a proper sense of duty" },
      { id: 59, word: "Jovial", meaning: "cheerful and friendly" },
      { id: 60, word: "Lectured", meaning: "gave an educational talk or severe reprimand" },
      { id: 61, word: "Ludicrous", meaning: "so foolish or unreasonable as to be amusing" },
      { id: 62, word: "Mafia", meaning: "an organized international body of criminals" },
      { id: 63, word: "Melee", meaning: "a confused fight, skirmish, or scuffle" },
      { id: 64, word: "Mobsters", meaning: "members of a criminal gang or mob" },
      { id: 65, word: "Moaned", meaning: "made a long, low sound expressing pain or grief" },
      { id: 66, word: "Nemesis", meaning: "a long-standing rival or archenemy" },
      { id: 67, word: "Nonsensical", meaning: "having no meaning; making no sense" },
      { id: 68, word: "Occult", meaning: "mysterious, magical, or supernatural phenomena" },
      { id: 69, word: "Omnivore", meaning: "an animal that eats both plants and meat" },
      { id: 70, word: "Outrageous", meaning: "shocking, unacceptable, or extreme" },
      { id: 71, word: "Preached", meaning: "delivered a sermon or moral advice" },
      { id: 72, word: "Predators", meaning: "animals that hunt and kill other animals" },
      { id: 73, word: "Preposterous", meaning: "contrary to reason or common sense; absurd" },
      { id: 74, word: "Prey", meaning: "an animal hunted and killed by another for food" },
      { id: 75, word: "Private eye", meaning: "a private detective" },
      { id: 76, word: "Prowled", meaning: "moved stealthily or restlessly" },
      { id: 77, word: "Quarry", meaning: "an animal or victim being pursued or hunted" },
      { id: 78, word: "Requested", meaning: "asked politely or formally for something" },
      { id: 79, word: "Responded", meaning: "answered or replied to a statement or question" },
      { id: 80, word: "Retorted", meaning: "replied in a sharp or witty manner" },
      { id: 81, word: "Ridiculous", meaning: "deserving or inviting derision; absurd" },
      { id: 82, word: "Risible", meaning: "provoking laughter or ridiculous" },
      { id: 83, word: "Saboteurs", meaning: "people who engage in deliberate destruction" },
      { id: 84, word: "Scavengers", meaning: "animals or people that feed on discarded material" },
      { id: 85, word: "Senseless", meaning: "lacking common sense or judgment" },
      { id: 86, word: "Shadowing", meaning: "following and observing someone closely and secretly" },
      { id: 87, word: "Skirmish", meaning: "an episode of irregular or unplanned fighting" },
      { id: 88, word: "Sleuths", meaning: "detectives or investigators" },
      { id: 89, word: "Snares", meaning: "traps used for catching birds or small mammals" },
      { id: 90, word: "Stalk", meaning: "pursue or approach stealthily" },
      { id: 91, word: "Surveillance", meaning: "close observation, especially of a suspected person" },
      { id: 92, word: "Suspicions", meaning: "feelings or beliefs that something is wrong or guilty" },
      { id: 93, word: "Syllabus", meaning: "an outline of the subjects in a course of study" },
      { id: 94, word: "Swooped", meaning: "moved rapidly downward through the air" },
      { id: 95, word: "Symmetry", meaning: "the quality of being made up of exactly similar parts" },
      { id: 96, word: "Tattoo", meaning: "a permanent design made on skin, or a rhythmic tapping" },
      { id: 97, word: "Territory", meaning: "an area of land under the jurisdiction of a ruler or state" },
      { id: 98, word: "Testimony", meaning: "a formal written or spoken statement in a court" },
      { id: 99, word: "Tussle", meaning: "a vigorous struggle or scuffle" },
      { id: 100, word: "Unbiased", meaning: "showing no prejudice for or against something; impartial" },
      { id: 101, word: "Unbridled", meaning: "uncontrolled or unconstrained" },
      { id: 102, word: "Uncanny", meaning: "strange or mysterious, especially in an unsettling way" },
      { id: 103, word: "Uncharted", meaning: "not mapped or surveyed; unknown" },
      { id: 104, word: "Unchecked", meaning: "not controlled or restrained" },
      { id: 105, word: "Uncouth", meaning: "lacking good manners, refinement, or grace" },
      { id: 106, word: "Unearth", meaning: "find something in the ground or bring to light" },
      { id: 107, word: "Unerring", meaning: "always right or accurate; infallible" },
      { id: 108, word: "Unfounded", meaning: "having no foundation or basis in fact" },
      { id: 109, word: "Unfurled", meaning: "make or become spread out from a rolled state" },
      { id: 110, word: "Unheeded", meaning: "heard or noticed but disregarded or ignored" },
      { id: 111, word: "Unhinged", meaning: "mentally unbalanced or deranged" },
      { id: 112, word: "Unnamed", meaning: "not named or identified" },
      { id: 113, word: "Unnerve", meaning: "make someone lose courage or confidence" },
      { id: 114, word: "Unravel", meaning: "investigate and solve or undo twisted threads" },
      { id: 115, word: "Unreasonable", meaning: "not guided by or based on good sense" },
      { id: 116, word: "Unsavoury", meaning: "disagreeable to taste, smell, or moral character" },
      { id: 117, word: "Unscathed", meaning: "without suffering any injury, damage, or harm" },
      { id: 118, word: "Unsuited", meaning: "not convenient or suitable for a particular purpose" },
      { id: 119, word: "Untapped", meaning: "not yet exploited or used" },
      { id: 120, word: "Unwieldy", meaning: "difficult to carry or move because of size or shape" },
      { id: 121, word: "Utterance", meaning: "a spoken word, statement, or vocal sound" },
      { id: 122, word: "Villainy", meaning: "wicked or criminal behavior" },
      { id: 123, word: "Warned", meaning: "informed someone of a possible danger or problem" },
      { id: 124, word: "Warranty", meaning: "a written guarantee promising to repair or replace" },
      { id: 125, word: "Wiretap", meaning: "an act of secretly listening on a telephone wire" }
    ];

    const AUTHENTIC_SENTENCE_TEMPLATES = {
      "Amicably": "Despite their previous sharp disagreements, both leaders managed to settle the dispute (_____).",
      "Confessed": "After hours of cross-examination by detectives, the suspect finally (_____) to the crime.",
      "Commanded": "The captain stepped forward and loudly (_____) the crew to prepare for heavy weather.",
      "Inseparable": "Ever since their first day in elementary school, the two boys have been completely (_____).",
      "Accomplices": "The police suspect that the bank robber did not act alone and had two hidden (_____).",
      "Absurd": "The notion that the earth is completely flat is utterly (_____) and scientifically disproven.",
      "Adversary": "During the final round of the tournament, he faced his toughest (_____) yet.",
      "Devour": "Lions in the savanna will quickly (_____) their prey once the hunt is finished.",
      "Forensics": "The crime lab performed detailed (_____) to analyze the fingerprints left on the window.",
      "Sleuths": "The famous detective and his assistant were renowned as the most brilliant (_____) in London.",
      "Uncanny": "She has a (an) (_____) ability to guess exactly what people are thinking before they speak.",
      "Unscathed": "Miraculously, every passenger emerged from the minor traffic collision completely (_____).",
      "Unreasonable": "Demanding a full refund after using the product for three years is entirely (_____)."
    };

    function App() {
      const [view, setView] = useState('home'); // 'home' | 'quiz' | 'bank' | 'result'
      const [wordList, setWordList] = useState([]);
      const [history, setHistory] = useState([]);
      const [quizQuestions, setQuizQuestions] = useState([]);
      const [quizIndex, setQuizIndex] = useState(0);
      const [score, setScore] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [isAnswered, setIsAnswered] = useState(false);
      const [userAnswers, setUserAnswers] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        try {
          const savedWords = localStorage.getItem('vocab_words');
          let currentList = DEFAULT_WORDS;

          if (savedWords) {
            const parsed = JSON.parse(savedWords);
            if (Array.isArray(parsed) && parsed.length > 0) {
              const combined = [...DEFAULT_WORDS];
              parsed.forEach(item => {
                if (!combined.some(w => w.word.toLowerCase() === item.word.toLowerCase())) {
                  combined.push(item);
                }
              });
              currentList = combined;
            }
          }

          currentList.sort((a, b) => a.word.localeCompare(b.word));
          setWordList(currentList);
        } catch (e) {
          console.error("Storage load error:", e);
          setWordList(DEFAULT_WORDS);
        } finally {
          setLoading(false);
        }
      }, []);

      // Bulk & Auto Duplicate Filtering Add Function
      const handleAddWord = (inputStr) => {
        if (!inputStr.trim()) return 0;
        const tokens = inputStr.split(/[\n,\s]+/).map(t => t.trim()).filter(Boolean);
        if (tokens.length === 0) return 0;

        let addedCount = 0;
        let newList = [...wordList];

        tokens.forEach(rawToken => {
          const cleanWord = rawToken.charAt(0).toUpperCase() + rawToken.slice(1).toLowerCase();
          const exists = newList.some(w => w.word.toLowerCase() === cleanWord.toLowerCase());

          if (!exists) {
            newList.push({
              id: Date.now() + Math.random(),
              word: cleanWord,
              meaning: "custom vocabulary entry"
            });
            addedCount++;
          }
        });

        if (addedCount > 0) {
          newList.sort((a, b) => a.word.localeCompare(b.word));
          setWordList(newList);
          try {
            localStorage.setItem('vocab_words', JSON.stringify(newList));
          } catch(e){}
        }
        return addedCount;
      };

      const handleDeleteWord = (targetWord, id) => {
        const updated = wordList.filter(w => w.id !== id && w.word !== targetWord);
        setWordList(updated);
        try {
          localStorage.setItem('vocab_words', JSON.stringify(updated));
        } catch(e){}
      };

      const startQuiz = () => {
        if (wordList.length < 4) return;

        let available = wordList.filter(w => !history.includes(w.word));
        if (available.length < 10) {
          available = [...wordList];
          setHistory([]);
        }

        const shuffled = [...available].sort(() => 0.5 - Math.random());
        const selected = shuffled.slice(0, 10);

        const newHistory = [...history, ...selected.map(s => s.word)].slice(-40);
        setHistory(newHistory);

        const generated = selected.map((targetItem) => {
          const distractors = wordList
            .filter(w => w.word !== targetItem.word)
            .sort(() => 0.5 - Math.random())
            .slice(0, 3)
            .map(w => w.word);

          const options = [targetItem.word, ...distractors].sort(() => 0.5 - Math.random());
          let sentence = AUTHENTIC_SENTENCE_TEMPLATES[targetItem.word];
          if (!sentence) {
            sentence = `In accordance with the evidence, the key element identified was a (an) (_____).`;
          }

          return {
            target: targetItem,
            sentence: sentence,
            options: options,
            correctAnswer: targetItem.word
          };
        });

        setQuizQuestions(generated);
        setQuizIndex(0);
        setScore(0);
        setSelectedOption(null);
        setIsAnswered(false);
        setUserAnswers([]);
        setView('quiz');
      };

      const handleOptionClick = (opt) => {
        if (isAnswered) return;
        setSelectedOption(opt);
        setIsAnswered(true);

        const currentQ = quizQuestions[quizIndex];
        const isCorrect = opt === currentQ.correctAnswer;
        if (isCorrect) setScore(s => s + 1);

        setUserAnswers(prev => [...prev, {
          question: currentQ.sentence,
          correct: currentQ.correctAnswer,
          userChoice: opt,
          isCorrect: isCorrect
        }]);
      };

      const nextQuestion = () => {
        if (quizIndex + 1 < quizQuestions.length) {
          setQuizIndex(i => i + 1);
          setSelectedOption(null);
          setIsAnswered(false);
        } else {
          setView('result');
        }
      };

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [view, quizIndex, isAnswered]);

      if (loading) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-50">
            <div className="text-center font-bold text-indigo-600 text-lg">Loading VocabQuest...</div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col justify-between">
          <header className="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
            <div className="flex items-center gap-2 cursor-pointer" onClick={() => setView('home')}>
              <span className="text-2xl">🎓</span>
              <span className="text-2xl font-extrabold text-indigo-900 font-fun tracking-wide">VocabQuest</span>
            </div>
            <div className="flex items-center gap-3">
              <button
                onClick={() => setView('bank')}
                className="flex items-center gap-2 px-4 py-2 bg-indigo-50 text-indigo-700 font-bold rounded-xl hover:bg-indigo-100 transition text-sm"
              >
                <i data-lucide="book-open" className="w-4 h-4"></i>
                Word Bank ({wordList.length})
              </button>
            </div>
          </header>

          <main className="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col justify-center">
            {view === 'home' && (
              <div className="text-center py-12 px-6 bg-white rounded-3xl shadow-xl border border-slate-100 animate-pop">
                <span className="text-6xl mb-4 inline-block animate-bounce">🚀</span>
                <h1 className="text-4xl font-extrabold text-indigo-950 font-fun mb-3">Master Your Vocabulary!</h1>
                <p className="text-slate-600 max-w-md mx-auto mb-8 text-base">
                  Sharpen your reading & writing skills with AI-generated sentences and authentic excerpts.
                </p>

                <div className="flex flex-col sm:flex-row gap-4 justify-center items-center max-w-md mx-auto">
                  <button
                    onClick={startQuiz}
                    className="w-full sm:w-auto px-8 py-4 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-extrabold text-lg rounded-2xl shadow-lg hover:shadow-indigo-200 hover:scale-105 transition transform flex items-center justify-center gap-2"
                  >
                    <i data-lucide="play-circle" className="w-6 h-6"></i>
                    Start Quiz (10 Questions)
                  </button>

                  <button
                    onClick={() => setView('bank')}
                    className="w-full sm:w-auto px-6 py-4 bg-slate-100 text-slate-700 font-bold rounded-2xl hover:bg-slate-200 transition flex items-center justify-center gap-2"
                  >
                    <i data-lucide="list" className="w-5 h-5"></i>
                    View All Words ({wordList.length})
                  </button>
                </div>
              </div>
            )}

            {view === 'bank' && (
              <WordBankView
                wordList={wordList}
                onAddWord={handleAddWord}
                onDeleteWord={handleDeleteWord}
                onBack={() => setView('home')}
              />
            )}

            {view === 'quiz' && quizQuestions.length > 0 && (
              <div className="bg-white rounded-3xl p-6 md:p-8 shadow-xl border border-slate-100 animate-pop">
                <div className="flex justify-between items-center mb-6">
                  <span className="text-xs font-extrabold text-indigo-600 uppercase tracking-widest bg-indigo-50 px-3 py-1.5 rounded-lg">
                    Question {quizIndex + 1} of 10
                  </span>
                  <span className="text-sm font-bold text-slate-500">
                    Score: <strong className="text-indigo-600">{score}</strong>
                  </span>
                </div>

                <div className="bg-slate-50 p-6 rounded-2xl border-2 border-dashed border-slate-200 mb-8">
                  <p className="text-xl md:text-2xl font-bold text-slate-800 leading-relaxed">
                    {quizQuestions[quizIndex].sentence}
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                  {quizQuestions[quizIndex].options.map((option, idx) => {
                    let btnStyle = "bg-white border-2 border-slate-200 text-slate-800 hover:border-indigo-400";

                    if (isAnswered) {
                      if (option === quizQuestions[quizIndex].correctAnswer) {
                        btnStyle = "bg-emerald-50 border-2 border-emerald-500 text-emerald-900 font-extrabold";
                      } else if (option === selectedOption) {
                        btnStyle = "bg-rose-50 border-2 border-rose-500 text-rose-900 font-bold";
                      } else {
                        btnStyle = "bg-slate-50 border-2 border-slate-100 text-slate-400 opacity-50";
                      }
                    }

                    return (
                      <button
                        key={idx}
                        onClick={() => handleOptionClick(option)}
                        disabled={isAnswered}
                        className={`p-4 rounded-xl text-lg font-bold transition flex items-center justify-between text-left shadow-sm ${btnStyle}`}
                      >
                        <span>{option}</span>
                        {isAnswered && option === quizQuestions[quizIndex].correctAnswer && (
                          <span className="text-emerald-600 font-bold">✓ Correct</span>
                        )}
                      </button>
                    );
                  })}
                </div>

                {isAnswered && (
                  <div className="flex justify-end">
                    <button
                      onClick={nextQuestion}
                      className="px-8 py-3 bg-indigo-600 text-white font-bold text-lg rounded-xl shadow-lg hover:bg-indigo-700 transition flex items-center gap-2"
                    >
                      {quizIndex + 1 === quizQuestions.length ? 'See Results' : 'Next Question'}
                      <i data-lucide="arrow-right" className="w-5 h-5"></i>
                    </button>
                  </div>
                )}
              </div>
            )}

            {view === 'result' && (
              <div className="bg-white rounded-3xl p-8 shadow-xl border border-slate-100 text-center animate-pop">
                <span className="text-6xl mb-4 inline-block">🏆</span>
                <h2 className="text-3xl font-extrabold text-indigo-950 font-fun mb-2">Quiz Completed!</h2>
                <p className="text-slate-600 mb-6 text-lg">
                  You scored <strong className="text-indigo-600 font-extrabold">{score}</strong> out of <strong>10</strong>
                </p>

                <div className="text-left bg-slate-50 rounded-2xl p-4 mb-8 max-h-72 overflow-y-auto space-y-3 border border-slate-200">
                  {userAnswers.map((ans, i) => (
                    <div key={i} className="p-3 bg-white rounded-xl shadow-sm border border-slate-100 flex justify-between items-center text-sm">
                      <div>
                        <p className="font-semibold text-slate-800 mb-1">{ans.question}</p>
                        <p className="text-xs text-slate-500">
                          Your answer: <span className={ans.isCorrect ? "text-emerald-600 font-bold" : "text-rose-600 font-bold"}>{ans.userChoice}</span>
                          {!ans.isCorrect && ` (Correct: ${ans.correct})`}
                        </p>
                      </div>
                      <span className={ans.isCorrect ? "text-emerald-500 font-bold text-lg" : "text-rose-500 font-bold text-lg"}>
                        {ans.isCorrect ? "✓" : "✕"}
                      </span>
                    </div>
                  ))}
                </div>

                <div className="flex justify-center gap-4">
                  <button
                    onClick={startQuiz}
                    className="px-6 py-3 bg-indigo-600 text-white font-bold rounded-xl shadow-md hover:bg-indigo-700 transition"
                  >
                    Play Again
                  </button>
                  <button
                    onClick={() => setView('home')}
                    className="px-6 py-3 bg-slate-100 text-slate-700 font-bold rounded-xl hover:bg-slate-200 transition"
                  >
                    Back to Home
                  </button>
                </div>
              </div>
            )}
          </main>

          <footer className="text-center py-4 text-xs text-slate-400 border-t border-slate-100 bg-white">
            VocabQuest © 2026 • AI-Powered Learning for Kids
          </footer>
        </div>
      );
    }

    // Component for Word Bank Management Screen (with Orange Duplicate Card Highlighting)
    function WordBankView({ wordList, onAddWord, onDeleteWord, onBack }) {
      const [inputWord, setInputWord] = useState('');
      const [message, setMessage] = useState('');

      // Find duplicate word counts
      const wordCounts = {};
      wordList.forEach(item => {
        const lower = item.word.toLowerCase();
        wordCounts[lower] = (wordCounts[lower] || 0) + 1;
      });

      const handleAdd = (e) => {
        e.preventDefault();
        if (!inputWord.trim()) return;

        const count = onAddWord(inputWord);
        if (count > 0) {
          setMessage(`✨ ${count} new word(s) added & sorted!`);
        } else {
          setMessage(`ℹ️ Word(s) already in bank. Automatically skipped.`);
        }
        setInputWord('');
        setTimeout(() => setMessage(''), 4000);
      };

      return (
        <div className="max-w-4xl mx-auto px-4 py-8 animate-pop">
          <div className="flex items-center justify-between mb-6">
            <button
              onClick={onBack}
              className="flex items-center gap-2 px-4 py-2 bg-white rounded-xl shadow-sm text-indigo-600 font-bold hover:bg-indigo-50 transition"
            >
              <i data-lucide="arrow-left" className="w-4 h-4"></i> Back to Home
            </button>
            <h1 className="text-2xl md:text-3xl font-extrabold text-indigo-900 font-fun">
              📖 Word Bank Directory ({wordList.length})
            </h1>
          </div>

          <div className="bg-white rounded-2xl p-6 shadow-md border-2 border-indigo-100 mb-8">
            <h2 className="text-xl font-bold text-slate-800 mb-2 font-fun">Add Words to Vocabulary Bank</h2>
            <p className="text-sm text-slate-500 mb-4">
              Separated by <strong>commas, spaces, or newlines</strong>. Duplicates are auto-filtered.
            </p>
            <form onSubmit={handleAdd} className="flex flex-col sm:flex-row gap-3">
              <input
                type="text"
                placeholder="e.g. Confessed, Commanded, Devour..."
                value={inputWord}
                onChange={(e) => setInputWord(e.target.value)}
                className="flex-1 px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-indigo-500 focus:outline-none text-slate-800 font-semibold"
              />
              <button
                type="submit"
                className="px-6 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-bold rounded-xl shadow-md hover:opacity-90 transition whitespace-nowrap"
              >
                + Add Words
              </button>
            </form>
            {message && (
              <p className="mt-3 text-sm font-bold text-indigo-600 bg-indigo-50 p-2.5 rounded-lg border border-indigo-100 animate-pop">
                {message}
              </p>
            )}
          </div>

          {/* Word Cards Grid (Highlights Duplicates in Orange) */}
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {wordList.map((item) => {
              const isDuplicate = wordCounts[item.word.toLowerCase()] > 1;

              // Orange card style for duplicate entries
              const cardBg = isDuplicate 
                ? "bg-orange-50 border-2 border-orange-400 text-orange-950" 
                : "bg-white border border-slate-100";

              return (
                <div key={item.id} className={`${cardBg} p-4 rounded-xl shadow-sm flex justify-between items-center hover:shadow-md transition`}>
                  <div>
                    <div className="flex items-center gap-2">
                      <h3 className={`text-lg font-bold ${isDuplicate ? 'text-orange-900' : 'text-indigo-900'}`}>
                        {item.word}
                      </h3>
                      {isDuplicate && (
                        <span className="text-[10px] font-extrabold uppercase px-2 py-0.5 bg-orange-200 text-orange-800 rounded-md">
                          Duplicate
                        </span>
                      )}
                    </div>
                    <p className="text-xs text-slate-500">{item.meaning || 'vocabulary word'}</p>
                  </div>
                  <div className="flex items-center gap-1">
                    <button
                      onClick={() => {
                        const utterance = new SpeechSynthesisUtterance(item.word);
                        utterance.lang = 'en-US';
                        window.speechSynthesis.speak(utterance);
                      }}
                      className="p-2 text-slate-400 hover:text-indigo-600 rounded-lg hover:bg-slate-50 transition"
                      title="Listen pronunciation"
                    >
                      <i data-lucide="volume-2" className="w-5 h-5"></i>
                    </button>
                    <button
                      onClick={() => {
                        if (confirm(`Delete "${item.word}" from your Word Bank?`)) {
                          onDeleteWord(item.word, item.id);
                        }
                      }}
                      className="p-2 text-slate-400 hover:text-red-500 rounded-lg hover:bg-red-50 transition"
                      title="Delete word"
                    >
                      <i data-lucide="trash-2" className="w-5 h-5"></i>
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
